; This file contains only objects that are units that aren't tied to a
; specific faction such as lions, tigers, and bears...

Object Bird
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = CIBird
      Animation = CIBird.CIBird
      AnimationMode = LOOP
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Bird
  EditorSorting = MISC_NATURAL

  ; *** ENGINEERING Parameters ***
  Body = ActiveBody ModuleTag_02
    MaxHealth = 1.0
    InitialHealth = 1.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
  End
  Locomotor = SET_NORMAL BirdLocomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 5.0
  End

  Scale = 5.0
  ; Shadow = SHADOW_VOLUME
End

Object Ox
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = CIox_SKN
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_IDL
      AnimationMode = ONCE
    End

    ConditionState = MOVING
      Animation = CIox_SKL.CIox_WKA
      AnimationMode = LOOP
      Flags = RANDOMSTART
    End

    ConditionState = MOVING PANICKING
      Animation = CIox_SKL.CIox_RUN
      AnimationMode = LOOP
      Flags = RANDOMSTART
    End

    ConditionState = DYING
      Animation = CIox_SKL.CIox_DTA
      AnimationMode = ONCE
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Ox
  EditorSorting = MISC_NATURAL

  ; *** AUDIO Parameters ***
  SoundAmbient = CowAmbience

  ; *** ENGINEERING Parameters ***
  Body = ActiveBody ModuleTag_02
    MaxHealth = 1.0
    InitialHealth = 1.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
  End
  Locomotor = SET_NORMAL BasicCarLocomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 5.0
  End

  Scale = 1.5
  ; Shadow = SHADOW_VOLUME
End
