Object AmericaWallHub
  ; *** ART Parameters ***
  SelectPortrait = SAFence_L
  ButtonImage = SAFence
  Draw = W3DModelDraw ModuleTag_01
    ; day
    ConditionState = NONE
      Model = ABSecWallX
    End
    ConditionState = DAMAGED
      Model = ABSecWallX_D
      ParticleSysBone = SparkS01 SparksSmall
    End
    ConditionState = REALLYDAMAGED RUBBLE
      Model = ABSecWallX_E
      ParticleSysBone = SmokeM01 SmokeFactionMedium
      ; ParticleSysBone = FireM01 FireFactionMedium
      ParticleSysBone = SparkM01 SparksMedium
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Wall
  Side = America
  EditorSorting = STRUCTURE
  VisionRange = 150.0
  ShroudClearingRange = 150.0
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End

  Prerequisites
    Object = AmericaBarracks
  End
  BuildCost = 50
  BuildTime = 2.0 ; in seconds
  ExperienceValue = 50 50 50 50
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles

  ; *** AUDIO Parameters ***
  VoiceSelect = NoSound

  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD STRUCTURE SELECTABLE STICK_TO_TERRAIN_SLOPE IMMOBILE LINEBUILD DEFENSIVE_WALL
  Body = StructureBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = DestroyDie ModuleTag_03
    DeathTypes = ALL -TOPPLED
  End
  Behavior = CreateObjectDie ModuleTag_04
    DeathTypes = ALL -TOPPLED
    CreationList = OCL_GenericWallSegmentDebris
  End
  Behavior = FXListDie ModuleTag_05
    DeathTypes = ALL -TOPPLED
    DeathFX = FX_GenericWallSegmentDeath
  End

  Geometry = BOX
  GeometryMajorRadius = 3.0
  GeometryMinorRadius = 4.0
  GeometryHeight = 20.0
  GeometryIsSmall = NO
  FenceWidth = 6.0 ; Spacing used by the fence tool in worldbuilder.
  FenceXOffset = 0.0 ; Offset used by the fence tool in worldbuilder so corners line up.
  Shadow = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER
End
