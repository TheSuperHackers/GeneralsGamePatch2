Object ChinaWallHub
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ; day
    ConditionState = NONE
      Model = NBWall02X
    End
    ConditionState = DAMAGED
      Model = NBWall02X_D
    End
    ConditionState = REALLYDAMAGED RUBBLE
      Model = NBWall02X_E
    End

    ConditionState = SNOW
      Model = NBWall02X_S
    End
    ConditionState = DAMAGED SNOW
      Model = NBWall02X_DS
    End
    ConditionState = REALLYDAMAGED RUBBLE SNOW
      Model = NBWall02X_ES
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Wall
  Side = China
  EditorSorting = STRUCTURE
  VisionRange = 150.0
  ShroudClearingRange = 150.0
  ArmorSet
    Conditions = NONE
    Armor = WallArmor
    DamageFX = StructureDamageFXNoShake
  End

  Prerequisites
    Object = ChinaBarracks
  End
  BuildCost = 50
  BuildTime = 1.0 ; in seconds
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles

  ; *** AUDIO Parameters ***
  VoiceSelect = NoSound

  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD STRUCTURE SELECTABLE STICK_TO_TERRAIN_SLOPE IMMOBILE LINEBUILD DEFENSIVE_WALL
  Body = StructureBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = InstantDeathBehavior ModuleTag_03
    FX = FX_GenericWallSegmentDeath
    OCL = OCL_GenericWallSegmentDebris
  End

  Geometry = BOX
  GeometryMajorRadius = 4.0
  GeometryMinorRadius = 6.0
  GeometryHeight = 12.0
  GeometryIsSmall = NO
  FenceWidth = 12.0 ; Spacing used by the fence tool in worldbuilder.
  FenceXOffset = 0.0 ; Offset used by the fence tool in worldbuilder so corners line up.
  Shadow = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER
End
