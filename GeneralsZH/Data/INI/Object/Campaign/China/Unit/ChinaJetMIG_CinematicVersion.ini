Object ChinaJetMIG_CinematicVersion
  ; *** ART Parameters ***
  SelectPortrait = SNMig_L
  ButtonImage = SNMig

  UpgradeCameo1 = Upgrade_ChinaAircraftArmor
  UpgradeCameo2 = Upgrade_ChinaBlackNapalm

  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = NVMIG
      HideSubObject = BurnerFX01 BurnerFX02
      WeaponLaunchBone = PRIMARY WeaponA
    End

    ConditionState = JETEXHAUST
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = JETEXHAUST JETAFTERBURNER
      ShowSubObject = BurnerFX01 BurnerFX02
      ParticleSysBone = Exhaust01 JetExhaust
      ParticleSysBone = Exhaust02 JetExhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = REALLYDAMAGED
      Model = NVMIG_D
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = RUBBLE
      Model = NVMIG_D
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = NVMIG_D
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model = NVMIG_D
      ShowSubObject = BurnerFX01 BurnerFX02
      ParticleSysBone = Engine01 JetExhaust
      ParticleSysBone = Engine02 JetExhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = RUBBLE JETEXHAUST JETAFTERBURNER
      ; @todo srj -- model missing
      ; Model = NVMIG_D1B
      Model = NVMIG_D
      ShowSubObject = NONE
      ; HideSubObject is needed because they're inherited from the DefaultConditionState
      HideSubObject = NONE
      ParticleSysBone = Engine01 JetExhaust
      ParticleSysBone = Engine02 JetExhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:MIG
  Side = China
  EditorSorting = VEHICLE
  VisionRange = 300.0
  ShroudClearingRange = 300.0
  TransportSlotCount = 0

  ArmorSet
    Conditions = NONE
    Armor = AirplaneArmor
    DamageFX = NONE
  End

  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY NapalmMissileWeapon
    AutoChooseSources = PRIMARY NONE
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY BlackNapalmMissileWeapon
    AutoChooseSources = PRIMARY NONE
  End

  Prerequisites
    Object = ChinaAirfield
  End

  BuildCost = 1200
  BuildTime = 15.0
  ExperienceValue = 50 50 100 150
  ExperienceRequired = 0 100 200 400
  IsTrainable = YES
  CrusherLevel = 1 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = ChinaJetMIGCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = MigVoiceSelect
  VoiceMove = MigVoiceMove
  VoiceAttack = MigVoiceAttack
  VoiceAttackAir = MigVoiceAttackAir
  VoiceGuard = MigVoiceAirPatrol
  SoundMoveLoop = MigAmbientLoop ; don't want sound while sitting at the Airfield
  SoundAmbient = NoSound
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = MigVoiceCreate
    Afterburner = RaptorAfterburner
    VoiceGarrison = MigVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body = ActiveBody ModuleTag_02
    MaxHealth = 160.0
    InitialHealth = 160.0
  End

  Behavior = JetSlowDeathBehavior ModuleTag_03
    DestructionDelay = 99999999
    FXOnGroundDeath = FX_JetOnGroundDeath
    OCLOnGroundDeath = OCL_MIGDeathFinalBlowUp_CinematicVersion
    FXInitialDeath = FX_MigDeathInitial
    OCLInitialDeath = OCL_MIGDeathInitial
    DelaySecondaryFromInitialDeath = 500 ; in milliseconds
    FXSecondary = FX_JetDeathSecondary
    OCLSecondary = OCL_MIGDeathSecondary
    FXHitGround = FX_JetDeathHitGround
    OCLHitGround = OCL_MIGDeathHitGround
    DelayFinalBlowUpFromHitGround = 200 ; in milliseconds
    FXFinalBlowUp = FX_JetDeathFinalBlowUp_CinematicVersion
    OCLFinalBlowUp = OCL_MIGDeathFinalBlowUp_CinematicVersion
    RollRate = 0.2
    RollRateDelta = 100.0% ; each frame, rollrate = rollrate * rollrateDelta
    PitchRate = 0.0
    FallHowFast = 110.0% ; Bigger is faster (can be over 100%; it's a fraction of gravity)
  End

  Behavior = WeaponSetUpgrade ModuleTag_04
    TriggeredBy = Upgrade_ChinaBlackNapalm
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End

  Behavior = JetAIUpdate ModuleTag_06
    OutOfAmmoDamagePerSecond = 10.0%
    TakeoffDistForMaxLift = 0.0% ; larger numbers give more lift sooner when taking off
    TakeoffPause = 500
    MinHeight = 5.0
    ReturnToBaseIdleTime = 10000
  End

  Locomotor = SET_NORMAL MIGLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_08
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_09
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_MIGDamageTransition
  End

  Behavior = MaxHealthUpgrade ModuleTag_10
    TriggeredBy = Upgrade_ChinaAircraftArmor
    AddMaxHealth = 40.0
    ChangeType = ADD_CURRENT_HEALTH_TOO ; Choices are PRESERVE_RATIO, ADD_CURRENT_HEALTH_TOO, and SAME_CURRENTHEALTH
  End

  Geometry = BOX
  GeometryMajorRadius = 14.0
  GeometryMinorRadius = 7.0
  GeometryHeight = 5.0
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
