Object PatriotMissileEMP
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = AVRaptor_M
    End
    ConditionState = JAMMED
      ParticleSysBone = NONE SparksMedium
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:PatriotMissile
  EditorSorting = SYSTEM
  VisionRange = 300.0
  ShroudClearingRange = 0.0

  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = CAN_CAST_REFLECTIONS PROJECTILE SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0

    SubdualDamageCap = 200.0
    SubdualDamageHealRate = 100000
    SubdualDamageHealAmount = 50.0
  End

  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quietly destroy ourselves
    FX = FINAL WeaponFX_EMPRocketDetonation
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX = FX_GenericMissileDisintegrate
    OCL = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX = FINAL WeaponFX_EMPRocketDetonation
  End

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 1.0
  End
  Behavior = MissileAIUpdate ModuleTag_05
    TryToFollowTarget = YES
    FuelLifetime = 10000
    InitialVelocity = 50.0 ; in dist/sec
    IgnitionDelay = 0
    DistanceToTravelBeforeTurning = 5.0
    DistanceToTargetForLock = 100.0 ; If it gets within 100 of the target, it kills the target.
  End
  Locomotor = SET_NORMAL PatriotMissileLocomotor

  ; Behavior = CreateObjectDie ModuleTag_07
  ;   CreationList = SupW_OCL_PatriotEMPEffectSpheroid
  ; End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_09
    DeathWeapon = ScudStormDamageWeapon
    ; StartsActive = YES
  End

  ; Behavior = SlowDeathBehavior ModuleTag_10
  ;   DestructionDelay = 0
  ;   DestructionDelayVariance = 0
  ;   FX = FINAL WeaponFX_EMPRocketDetonation
  ; End

  Geometry = SPHERE
  GeometryMajorRadius = 2.0
  GeometryIsSmall = YES
End
