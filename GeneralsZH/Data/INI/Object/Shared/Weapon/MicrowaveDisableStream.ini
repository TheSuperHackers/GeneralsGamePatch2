Object MicrowaveDisableStream
  ; *** ART Parameters ***
  Draw = W3DLaserDraw ModuleTag_01
    Texture = EXSineWave.tga
    NumBeams = 1 ; Number of overlapping cylinders that make the beam. 1 beam will just use inner data. Current max: 10
    InnerBeamWidth = 8.0
    OuterBeamWidth = 5.0
    InnerColor = R:100 G:200 B:100 A:50
    OuterColor = R:96 G:255 B:96 A:5
    ScrollRate = -10.0 ; Scrolls the texture offset this fast -- towards(-) away(+)
    Tile = YES
    TilingScalar = 0.5
  End

  KindOf = IMMOBILE
  ClientUpdate = LaserUpdate ModuleTag_02
    MuzzleParticleSystem = GenericGreenLaserFlare
    TargetParticleSystem = HackFlare
  End

  Behavior = DeletionUpdate ModuleTag_03
    MinLifetime = 126 ; min lifetime in milliseconds
    MaxLifetime = 126 ; max lifetime in milliseconds
  End
End
