Object SupW_AuroraFuelAirBomb
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = EXCarptBmb
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:FuelAirBomb
  EditorSorting = SYSTEM
  VisionRange = 300.0
  ShroudClearingRange = 0.0
  TransportSlotCount = 10
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** AUDIO Parameters ***

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = CreateObjectDie ModuleTag_03
    CreationList = SupW_OCL_FuelAirBomb
  End
  Behavior = FXListDie ModuleTag_04
    DeathFX = AirF_FX_AuroraBombExplode
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 75.0
    AerodynamicFriction = 1.0 ; friction/sec
    ForwardFriction = 33.0 ; friction/sec
    CenterOfMassOffset = 2.0 ; Default of 0 means nothing tips as it falls. Positive tips forward, negative tips back
  End
  Behavior = MissileAIUpdate ModuleTag_06
    TryToFollowTarget = NO
    FuelLifetime = 0
    InitialVelocity = 0.0 ; in dist/sec
    IgnitionDelay = 0
    DistanceToTravelBeforeTurning = 0.0
    DistanceToTargetBeforeDiving = 0.0
  End
  Behavior = HeightDieUpdate ModuleTag_07
    TargetHeight = 15.0
    TargetHeightIncludesStructures = YES
  End
  Locomotor = SET_NORMAL AuroraBombLocomotor ; yes, that's right.
  Geometry = SPHERE
  GeometryMajorRadius = 12.0
  GeometryIsSmall = YES
End
