  ; Behavior = FXListDie ModuleTag_04
  ;   DeathFX = WeaponFX_MOAB_Blast
  ; End

  Behavior = DestroyDie ModuleTag_05
    ; <NO DATA>
  End

  Behavior = AIUpdateInterface ModuleTag_06
  End
  Locomotor = SET_NORMAL NONE
  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 75.0
    AerodynamicFriction = 1.0 ; friction/sec
    ForwardFriction = 33.0 ; friction/sec
    CenterOfMassOffset = 2.0 ; Default of 0 means nothing tips as it falls. Positive tips forward, negative tips back
  End
  Behavior = HeightDieUpdate ModuleTag_08
    TargetHeight = 5.0
    TargetHeightIncludesStructures = YES
  End

  Behavior = SpecialPowerCompletionDie ModuleTag_09
    SpecialPowerTemplate = SuperweaponMOAB
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_10
    DeathWeapon = MOABDetonationWeapon
    StartsActive = YES
  End

  Behavior = SmartBombTargetHomingUpdate ModuleTag_11
    CourseCorrectionScalar = 0.99 ; 1 == no homing, 0 == snap to; 0.99 == smooth, 0.95 == too fast
  End

  Geometry = SPHERE
  GeometryMajorRadius = 12.0
  GeometryIsSmall = YES
