Object GenericTankShell
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = AVTankShel
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TankShell
  EditorSorting = SYSTEM
  VisionRange = 0.0
  ArmorSet
    Armor = ProjectileArmor
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = DestroyDie ModuleTag_03
    ; <NO DATA>
  End

  Behavior = DumbProjectileBehavior ModuleTag_04
    FirstHeight = 10.0 ; Height of the Bezier control points above the highest intervening terrain
    SecondHeight = 10.0
    FirstPercentIndent = 50.0% ; Percentage of shot distance in which control points are placed
    SecondPercentIndent = 90.0%
    FlightPathAdjustDistPerSecond = 100.0 ; Can allow a max speed this can attempt to follow a target. Units are their velocity we can tag.
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 0.01 ; we can't have a zero mass, but we want it pretty tiny...
  End

  Geometry = SPHERE
  GeometryMajorRadius = 1.0
  GeometryIsSmall = YES
End
