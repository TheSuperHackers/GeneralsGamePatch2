Object NukeBomb
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = AVBomber_B
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Missile
  EditorSorting = SYSTEM
  VisionRange = 0.0 ; Projectiles can't see, but superweapons *may need to*
  TransportSlotCount = 1 ; since Napalm Strike carries us as a payload, not a weapon
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD NO_COLLIDE UNATTACKABLE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = PhysicsBehavior ModuleTag_06
    Mass = 75.0
    AerodynamicFriction = 0.1 ; friction/sec
    ForwardFriction = 0.1 ; friction/sec
    CenterOfMassOffset = 0.13 ; Default of 0 means nothing tips as it falls. Positive tips forward, negative tips back
  End

  Behavior = HeightDieUpdate ModuleTag_10
    TargetHeight = 10.0
    TargetHeightIncludesStructures = NO
  End

  Behavior = InstantDeathBehavior ModuleTag998
    DeathTypes = ALL
    Weapon = HelixNukeBombDetonationWeaponWithAnEvenLongerName
  End

  Scale = 0.7
  Geometry = SPHERE
  GeometryMajorRadius = 1.0
  GeometryIsSmall = YES
End
