Object TechRepairPad
  ; *** ART Parameters ***
  SelectPortrait = SADropZone_L
  ButtonImage = SADropZone
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = ABSupDrop
      Animation = ABSupDrop.ABSupDrop
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = DAMAGED
      Model = ABSupDrop_D
      Animation = ABSupDrop_D.ABSupDrop_D
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = REALLYDAMAGED RUBBLE
      Model = ABSupDrop_E
      Animation = ABSupDrop_E.ABSupDrop_E
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = NIGHT
      Model = ABSupDrop_N
      Animation = ABSupDrop_N.ABSupDrop_N
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = DAMAGED NIGHT
      Model = ABSupDrop_DN
      Animation = ABSupDrop_DN.ABSupDrop_DN
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = REALLYDAMAGED RUBBLE NIGHT
      Model = ABSupDrop_EN
      Animation = ABSupDrop_EN.ABSupDrop_EN
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ; snow

    ConditionState = SNOW
      Model = ABSupDrop_S
      Animation = ABSupDrop_S.ABSupDrop_S
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = DAMAGED SNOW
      Model = ABSupDrop_DS
      Animation = ABSupDrop_DS.ABSupDrop_DS
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = REALLYDAMAGED RUBBLE SNOW
      Model = ABSupDrop_ES
      Animation = ABSupDrop_ES.ABSupDrop_ES
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ; night snow

    ConditionState = NIGHT SNOW
      Model = ABSupDrop_NS
      Animation = ABSupDrop_NS.ABSupDrop_NS
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = DAMAGED NIGHT SNOW
      Model = ABSupDrop_DNS
      Animation = ABSupDrop_DNS.ABSupDrop_DNS
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End

    ConditionState = REALLYDAMAGED RUBBLE NIGHT SNOW
      Model = ABSupDrop_ENS
      Animation = ABSupDrop_ENS.ABSupDrop_ENS
      AnimationMode = LOOP
      ParticleSysBone = Flare01 LandingZoneSmoke
    End
    OkToChangeModelColor = YES
  End
  ; Flag Model
  Draw = W3DModelDraw ModuleTag_02
    ; default & damaged
    ConditionState = NONE
      Model = ZBODerrick_F
      Animation = ZBODerrick_F.ZBODerrick_F
      AnimationMode = LOOP
    End
    AliasConditionState = DAMAGED

    ; reallydamaged
    ConditionState = REALLYDAMAGED
      Model = ZBODerrick_FE
      Animation = ZBODerrick_FE.ZBODerrick_FE
      AnimationMode = LOOP
    End

    ; rubble
    ConditionState = RUBBLE
      Model = NONE
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TechRepairPad
  EditorSorting = STRUCTURE
  ShroudClearingRange = 200.0
  PlacementViewAngle = -45.0
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End
  Prerequisites
  End
  EnergyProduction = 0
  ExperienceValue = 200 200 200 200
  ; CommandSet = TechReinforcementPadCommandSet
  ; *** AUDIO Parameters ***
  VoiceSelect = SupplyDropZoneSelect

  UnitSpecificSounds
    UnderConstruction = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = STRUCTURE
  KindOf = STRUCTURE SELECTABLE IMMOBILE SCORE TECH_BUILDING CAPTURABLE REPAIR_PAD CONSERVATIVE_BUILDING

  Body = ActiveBody ModuleTag_04
    MaxHealth = 1000.0
    InitialHealth = 1000.0
  End
  Behavior = RepairDockUpdate ModuleTag_05
    TimeForFullHeal = 5000.0 ; in milliseconds
    AllowsPassthrough = YES
    NumberApproachPositions = 5
  End

  Behavior = DestroyDie ModuleTag_06
  End
  Behavior = CreateObjectDie ModuleTag_08
    CreationList = OCL_LargeStructureDebris
  End

  Behavior = FlammableUpdate ModuleTag_09
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End
  Behavior = FXListDie ModuleTag_10
    DeathFX = FX_StructureMediumDeath
  End
  Behavior = TechBuildingBehavior ModuleTag_12
  End
  Behavior = KeepObjectDie ModuleTag_IWantRubble
  End
  Behavior = BaseRegenerateUpdate ModuleTag_11
  End
  Behavior = TransitionDamageFX ModuleTag_31
