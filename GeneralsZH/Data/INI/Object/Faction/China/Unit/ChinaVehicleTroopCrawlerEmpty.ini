  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY TroopCrawlerAssault
  End
  Prerequisites
    Object = ChinaWarFactory
  End
  BuildCost = 700
  BuildTime = 1.0 ; in seconds
  CrusherLevel = 2 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
