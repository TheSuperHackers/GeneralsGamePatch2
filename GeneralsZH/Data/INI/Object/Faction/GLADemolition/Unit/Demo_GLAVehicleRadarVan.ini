Object Demo_GLAVehicleRadarVan
  ; *** ART Parameters ***
  SelectPortrait = SURadarVan_L
  ButtonImage = SURadarVan

  UpgradeCameo1 = Upgrade_GLARadarVanScan
  UpgradeCameo2 = Upgrade_GLAJunkRepair
  UpgradeCameo3 = Demo_Upgrade_SuicideBomb

  Draw = W3DTruckDraw ModuleTag_01
    DefaultConditionState
      Model = UVRadarVan
      Animation = UVRadarVan.UVRadarVan
      AnimationMode = LOOP
    End

    ConditionState = REALLYDAMAGED
      Model = UVRadarVan_D
      Animation = UVRadarVan_D.UVRadarVan_D
      AnimationMode = LOOP
    End

    ConditionState = RUBBLE
      Model = UVRadarVan_D
      Animation = UVRadarVan_D.UVRadarVan_D
      AnimationMode = LOOP
    End
    OkToChangeModelColor = YES

    TrackMarks = EXTireTrack.tga

    ; These parameters are only used if the model has a separate suspension,
    ; and the locomotor has HasSuspension = YES.
    LeftFrontTireBone = Tire01
    RightFrontTireBone = Tire02
    LeftRearTireBone = Tire03
    RightRearTireBone = Tire04
    TireRotationMultiplier = 0.2 ; this * speed = rotation.
    PowerslideRotationAddition = 2.5 ; This speed is added to the rotation speed when power-sliding.
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:RadarVan
  Side = GLADemolitionGeneral
  EditorSorting = VEHICLE
  VisionRange = 200.0
  ShroudClearingRange = 500.0
  TransportSlotCount = 3
  ArmorSet
    Conditions = NONE
    Armor = TruckArmor
    DamageFX = TankDamageFX
  End
  WeaponSet
    Weapon = PRIMARY NONE
    Weapon = SECONDARY NONE
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY NONE
    AutoChooseSources = PRIMARY NONE
  End
  Prerequisites
    Object = Demo_GLAArmsDealer
  End
  BuildCost = 500
  BuildTime = 10.0 ; in seconds

  ExperienceValue = 20 20 20 20
  IsTrainable = NO
  CrusherLevel = 2 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = Demo_GLAVehicleRadarVanCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = RadarVanVoiceSelect
  VoiceMove = RadarVanVoiceMove
  VoiceAttack = RadarVanVoiceMove
  SoundMoveStart = RadarVanMoveStart
  SoundMoveStartDamaged = RadarVanMoveStart

  UnitSpecificSounds
    VoiceCreate = RadarVanVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    ; Required for the W3DTruckDraw module
    TruckLandingSound = NoSound ; RocketBuggyLand
    TruckPowerslideSound = NoSound ; RocketBuggyPowerslide
    VoiceCrush = RadarVanVoiceCrush
    VoiceEnter = RadarVanVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS VEHICLE SALVAGER SCORE IGNORES_SELECT_ALL

  Body = ActiveBody ModuleTag_02
    MaxHealth = 200.0
    InitialHealth = 200.0

    SubdualDamageCap = 400.0
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50.0
  End

  Behavior = GrantUpgradeCreate ModuleTag_03
    UpgradeToGrant = Upgrade_GLARadar
  End
  Behavior = RadarUpgrade ModuleTag_05
    TriggeredBy = Upgrade_GLARadar
    DisableProof = YES ; Won't be disabled by low power
  End

  Behavior = OCLSpecialPower ModuleTag_06
    SpecialPowerTemplate = SpecialPowerRadarVanScan
    StartsPaused = YES ; Unpaused by the upgrade module
    OCL = SUPERWEAPON_RadarVanScan
    CreateLocation = CREATE_AT_LOCATION
  End

  Behavior = UnpauseSpecialPowerUpgrade ModuleTag_07
    TriggeredBy = Upgrade_GLARadarVanScan
    SpecialPowerTemplate = SpecialPowerRadarVanScan
  End

  Behavior = AutoHealBehavior ModuleTag_08
    TriggeredBy = Upgrade_GLAJunkRepair
    HealingAmount = 2
    HealingDelay = 1000 ; in milliseconds
  End

  Behavior = AIUpdateInterface ModuleTag_09
    Turret
      TurretTurnRate = 100.0
      ControlledWeaponSlots = PRIMARY
    End
  End
  Locomotor = SET_NORMAL RadarVanLocomotor

  Behavior = PhysicsBehavior ModuleTag_10
    Mass = 50.0
  End

  ; The default explosion
  Behavior = SlowDeathBehavior ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 5
    ModifierBonusPerOverkillPercent = 20.0% ; negative means less likely to pick this in the face of much damage, positive means more likely
    DestructionDelay = 0
    DestructionDelayVariance = 200
    FX = FINAL FX_BuggyNewDeathExplosion
    OCL = FINAL OCL_RadarVanDeathEffect
  End

  Behavior = FlammableUpdate ModuleTag_13
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior = DestroyDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  Behavior = CreateCrateDie ModuleTag_15
    CrateData = SalvageCrateData
  End

  Behavior = StealthDetectorUpdate ModuleTag_16
    DetectionRate = 500 ; how often to rescan for stealthed things in my sight (milliseconds)
    DetectionRange = 250.0
    CanDetectWhileGarrisoned = NO
    CanDetectWhileContained = NO
  End

  Behavior = FXListDie ModuleTag_17
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = CreateObjectDie ModuleTag_18
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior = TransitionDamageFX ModuleTag_19
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_CrusaderDamageTransition
  End

  Behavior = SlowDeathBehavior ModuleTag_Death_20
    DeathTypes = NONE +SUICIDED +EXPLODED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_TerroristExplode
    FlingForce = 8.0
    FlingForceVariance = 3.0
    FlingPitch = 60.0
    FlingPitchVariance = 10.0
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag998
    DeathTypes = NONE +SUICIDED
    TriggeredBy = Demo_Upgrade_SuicideBomb
    DeathWeapon = Demo_SuicideDynamitePackPlusFire
    StartsActive = NO
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag999
    DeathTypes = ALL -SUICIDED
    TriggeredBy = Demo_Upgrade_SuicideBomb
    DeathWeapon = Demo_DestroyedWeapon
    StartsActive = NO
  End

  Behavior = CommandSetUpgrade ModuleTag_22
    TriggeredBy = Demo_Upgrade_SuicideBomb
    CommandSet = Demo_GLAVehicleRadarVanCommandSetUpgrade
  End

  Geometry = BOX
  GeometryMajorRadius = 16.0
  GeometryMinorRadius = 6.0
  GeometryHeight = 12.5
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
