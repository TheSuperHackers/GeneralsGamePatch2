Object Demo_GLAVehicleScudLauncher
  ; *** ART Parameters ***
  SelectPortrait = SUScudLauncher_L
  ButtonImage = SUScudLauncher

  UpgradeCameo1 = Upgrade_GLAJunkRepair
  UpgradeCameo2 = Demo_Upgrade_SuicideBomb

  Draw = W3DTruckDraw ModuleTag_01
    DefaultConditionState
      Model = UVScudLchr
      Turret = TURRET
      TurretPitch = TURRETEL
      ShowSubObject = TURRET
      HideSubObject = TURRETUP01 TURRETUP02
      WeaponLaunchBone = PRIMARY WeaponA
      WeaponLaunchBone = SECONDARY WeaponA
    End

    ConditionState = REALLYDAMAGED
      Model = UVScudLchr_d
    End
    AliasConditionState = RUBBLE

    ConditionState = WEAPONSET_CRATEUPGRADE_ONE
      Model = UVScudLchr
      Turret = TURRETUP01
      TurretPitch = TURRETEL01
      ShowSubObject = TURRETUP01
      HideSubObject = TURRET TURRETUP02
      WeaponLaunchBone = PRIMARY WeaponB
      WeaponLaunchBone = SECONDARY WeaponB
    End

    ConditionState = WEAPONSET_CRATEUPGRADE_ONE REALLYDAMAGED
      Model = UVScudLchr_d
      Turret = TURRETUP01
      TurretPitch = TURRETEL01
      ShowSubObject = TURRETUP01
      HideSubObject = TURRET TURRETUP02
      WeaponLaunchBone = PRIMARY WeaponB
      WeaponLaunchBone = SECONDARY WeaponB
    End

    ConditionState = WEAPONSET_CRATEUPGRADE_TWO
      Model = UVScudLchr
      Turret = TURRETUP02
      TurretPitch = TURRETEL02
      ShowSubObject = TURRETUP02
      HideSubObject = TURRET TURRETUP01
      WeaponLaunchBone = PRIMARY WeaponC
      WeaponLaunchBone = SECONDARY WeaponC
    End

    ConditionState = WEAPONSET_CRATEUPGRADE_TWO REALLYDAMAGED
      Model = UVScudLchr_d
      Turret = TURRETUP02
      TurretPitch = TURRETEL02
      ShowSubObject = TURRETUP02
      HideSubObject = TURRET TURRETUP01
      WeaponLaunchBone = PRIMARY WeaponC
      WeaponLaunchBone = SECONDARY WeaponC
    End
    OkToChangeModelColor = YES

    TrackMarks = EXTireTrack.tga

    ProjectileBoneFeedbackEnabledSlots = PRIMARY SECONDARY ; WeaponLaunchBone will be shown/hidden, not just used for firing offset

    Dust = ScudLauncherDust
    DirtSpray = RocketBuggyDirtSpray
    PowerslideSpray = RocketBuggyDirtPowerSlide

    ; These parameters are only used if the model has a separate suspension,
    ; and the locomotor has HasSuspension = YES.
    LeftFrontTireBone = Tire01
    RightFrontTireBone = Tire05
    LeftRearTireBone = Tire04
    RightRearTireBone = Tire08
    MidLeftFrontTireBone = Tire02
    MidRightFrontTireBone = Tire06
    MidLeftRearTireBone = Tire03
    MidRightRearTireBone = Tire07

    TireRotationMultiplier = 0.2 ; this * speed = rotation.
    ; PowerslideRotationAddition = 0.0 ; This speed is added to the rotation speed when power-sliding.
  End

  ; *** DESIGN Parameters ***

  DisplayName = OBJECT:ScudLauncher
  Side = GLADemolitionGeneral
  EditorSorting = VEHICLE
  VisionRange = 180.0
  ShroudClearingRange = 300.0
  TransportSlotCount = 3

  ArmorSet
    Conditions = NONE
    Armor = TruckArmor
    DamageFX = TankDamageFX
  End

  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY DEMO_SCUDLauncherGunExplosive
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
    AutoChooseSources = TERTIARY NONE
  End
  WeaponSet
    Conditions = CRATEUPGRADE_ONE
    Weapon = PRIMARY DEMO_SCUDLauncherGunExplosivePlusOne
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
    AutoChooseSources = TERTIARY NONE
  End
  WeaponSet
    Conditions = CRATEUPGRADE_TWO
    Weapon = PRIMARY DEMO_SCUDLauncherGunExplosivePlusTwo
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
    AutoChooseSources = TERTIARY NONE
  End
  Prerequisites
    Object = Demo_GLAArmsDealer
    Object = Demo_GLAPalace
    Science = SCIENCE_ScudLauncher
  End
  BuildCost = 1200
  BuildTime = 15.0 ; in seconds

  ExperienceValue = 50 50 100 150
  ExperienceRequired = 0 100 200 400
  IsTrainable = YES
  CrusherLevel = 2 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = Demo_GLAVehicleScudLauncherCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = ScudLauncherVoiceSelect
  VoiceMove = ScudLauncherVoiceMove
  VoiceGuard = ScudLauncherVoiceMove
  VoiceAttack = ScudLauncherVoiceAttack
  SoundMoveStart = ScudLauncherMoveStart
  SoundMoveStartDamaged = ScudLauncherMoveStart
  UnitSpecificSounds
    VoiceCreate = ScudLauncherVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop
    TruckLandingSound = NoSound
    TruckPowerslideSound = NoSound
    VoiceCrush = ScudLauncherVoiceCrush
    VoiceEnter = ScudLauncherVoiceMove
    VoicePrimaryWeaponMode = ScudLauncherVoiceModeHiEx
    VoiceSecondaryWeaponMode = ScudLauncherVoiceModeAnthrax
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK DONT_AUTO_CRUSH_INFANTRY CAN_CAST_REFLECTIONS VEHICLE SALVAGER WEAPON_SALVAGER SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth = 180.0
    InitialHealth = 180.0

    SubdualDamageCap = 360.0
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 60.0 ; turn rate, in degrees/sec
      TurretPitchRate = 60.0
      FirePitch = 90.0 ; Instead of aiming pitch-wise at the target, it will aim here
      AllowsPitch = YES
      ControlledWeaponSlots = PRIMARY
    End
    AutoAcquireEnemiesWhenIdle = NO NOTWHILEATTACKING
  End

  Behavior = CommandButtonHuntUpdate ModuleTag_04 ; allows the use of the CommandButton Hunt script with this unit.
  End

  Locomotor = SET_NORMAL ScudLauncherLocomotor
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 40.0
  End

  Behavior = AutoHealBehavior ModuleTag_06
    TriggeredBy = Upgrade_GLAJunkRepair
    HealingAmount = 2
    HealingDelay = 1000 ; in milliseconds
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_ScudLauncherDamageTransition
  End

  ; Catch fire + explode death
  Behavior = SlowDeathBehavior ModuleTag_09
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 50
    DestructionDelay = 2000
    DestructionDelayVariance = 300
    FX = INITIAL FX_CrusaderCatchFire
    FX = FINAL FX_ScudLauncherExplosionOneFinal
    OCL = FINAL OCL_SCUDLauncherDeathEffect
  End

  Behavior = FXListDie ModuleTag_10
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End

  Behavior = CreateCrateDie ModuleTag_Salvage
    CrateData = SalvageCrateData
  End

  Behavior = CreateObjectDie ModuleTag_11
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior = DestroyDie ModuleTag_22
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  ; Behavior = WeaponSetUpgrade ModuleTag_23
  ;   TriggeredBy = Upgrade_GLAAnthraxBeta
  ; End

  ; Behavior = LockWeaponCreate ModuleTag_24
  ;   SlotToLock = PRIMARY ; Prevents indeterminate state plus two unpickable weapons equalling no attack.
  ; End

  ; Behavior = FireWeaponWhenDeadBehavior ModuleTag_Death24
  ;   DeathTypes = NONE +SUICIDED
  ;   DeathWeapon = Demo_SuicideDynamitePack
  ;   StartsActive = YES
  ; End

  ; Behavior = FireWeaponWhenDeadBehavior ModuleTag999
  ;   DeathTypes = ALL -SUICIDED -POISONED -POISONED_BETA -POISONED_GAMMA
  ;   TriggeredBy = Demo_Upgrade_SuicideBomb
  ;   RequiresAllTriggers = YES
  ;   DeathWeapon = Demo_SuicideDynamitePackPlusFire
  ;   StartsActive = NO
  ; End

  ; Behavior = FireWeaponWhenDeadBehavior ModuleTag998
  ;   DeathTypes = NONE +SUICIDED
  ;   TriggeredBy = Demo_Upgrade_SuicideBomb
  ;   RequiresAllTriggers = YES
  ;   DeathWeapon = Demo_SuicideDynamitePack
  ;   StartsActive = NO
  ; End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_George
    TriggeredBy = Demo_Upgrade_SuicideBomb
    DeathWeapon = Demo_SuicideDynamitePackPlusFire
    StartsActive = NO
  End

  Behavior = CommandSetUpgrade ModuleTag_26
    TriggeredBy = Demo_Upgrade_SuicideBomb
    CommandSet = Demo_GLAVehicleScudLauncherCommandSetUpgrade
  End

  Geometry = BOX
  GeometryMajorRadius = 14.0
  GeometryMinorRadius = 7.0
  GeometryHeight = 11.5
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
