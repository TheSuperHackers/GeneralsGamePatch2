Object AmericaJetStealthFighter
  ; *** ART Parameters ***
  SelectPortrait = SAStealth_L
  ButtonImage = SAStealth

  UpgradeCameo1 = Upgrade_AmericaLaserMissiles
  UpgradeCameo2 = Upgrade_AmericaAdvancedTraining
  UpgradeCameo3 = Upgrade_AmericaCountermeasures
  UpgradeCameo4 = Upgrade_AmericaBunkerBusters

  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = AVStealth
      HideSubObject = BurnerFX03 BurnerFX04
      WeaponLaunchBone = PRIMARY WeaponA
    End

    ConditionState = JETEXHAUST
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = JETEXHAUST JETAFTERBURNER
      ; afterburners
      ShowSubObject = BurnerFX03 BurnerFX04
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
      ParticleSysBone = Engine01 JetLenzflare
      ParticleSysBone = Engine02 JetLenzflare
    End

    ConditionState = REALLYDAMAGED
      Model = AVStealth_D
      ; damage
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetEngineDamagedSmoke
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = AVStealth_D
      ; damage
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model = AVStealth_D
      ; afterburners
      ShowSubObject = BurnerFX03 BurnerFX04
      ; damage
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
      ParticleSysBone = Engine01 JetLenzflare
      ParticleSysBone = Engine02 JetLenzflare
    End

    ConditionState = RUBBLE
      Model = AVStealth_D1
      ShowSubObject = NONE
      HideSubObject = NONE
    End

    ConditionState = RUBBLE JETEXHAUST JETAFTERBURNER
      Model = AVStealth_D1
      ShowSubObject = NONE
      ; HideSubObject is needed because they're inherited from the DefaultConditionState
      HideSubObject = NONE
      ParticleSysBone = Engine01 JetExhaust
      ParticleSysBone = Engine02 JetExhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:StealthFighter
  Side = America
  EditorSorting = VEHICLE
  VisionRange = 180.0
  ShroudClearingRange = 300.0
  TransportSlotCount = 0
  ArmorSet
    Conditions = NONE
    Armor = AirplaneArmor
    DamageFX = NONE
  End
  ArmorSet
    Conditions = PLAYER_UPGRADE
    Armor = CountermeasuresAirplaneArmor
    DamageFX = NONE
  End
  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY StealthJetMissileWeapon
  End
  Prerequisites
    Object = AmericaAirfield
    Science = SCIENCE_StealthFighter
  End

  BuildCost = 1600
  BuildTime = 25.0 ; in seconds
  ExperienceValue = 100 100 200 300
  ExperienceRequired = 0 200 300 600
  IsTrainable = YES
  CrusherLevel = 1 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = AmericaJetStealthFighterCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = StealthFighterVoiceSelect
  VoiceMove = StealthFighterVoiceMove
  VoiceAttack = StealthFighterVoiceAttack
  VoiceAttackAir = StealthFighterVoiceAttackAir
  VoiceGuard = StealthFighterVoiceAirPatrol
  SoundAmbient = StealthFighterAmbientLoop
  SoundAmbientRubble = NoSound
  SoundStealthOn = StealthOn
  SoundStealthOff = StealthOff
  UnitSpecificSounds
    VoiceCreate = StealthFighterVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    Afterburner = RaptorAfterburner
    VoiceLowFuel = StealthFighterVoiceLowFuel
    VoiceGarrison = StealthFighterVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = LOCAL_UNIT_ONLY
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body = ActiveBody ModuleTag_02
    MaxHealth = 120.0
    InitialHealth = 120.0
  End

  Behavior = JetSlowDeathBehavior ModuleTag_03
    DestructionDelay = 99999999
    FXOnGroundDeath = FX_JetOnGroundDeath
    OCLOnGroundDeath = OCL_StealthDeathFinalBlowUp
    FXInitialDeath = FX_StealthFighterDeathInitial
    ; OCLInitialDeath = NONE
    DelaySecondaryFromInitialDeath = 500 ; in milliseconds
    FXSecondary = FX_JetDeathSecondary
    ; OCLSecondary = NONE
    FXHitGround = FX_JetDeathHitGround
    ; OCLHitGround = NONE
    DelayFinalBlowUpFromHitGround = 200 ; in milliseconds
    FXFinalBlowUp = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp = OCL_StealthDeathFinalBlowUp
    ; DeathLoopSound = MICAL NEEDS TO MAKE ME
    RollRate = 0.2
    RollRateDelta = 100.0% ; each frame, rollrate = rollrate * rollrateDelta
    PitchRate = 0.0
    FallHowFast = 110.0% ; Bigger is faster (can be over 100%; it's a fraction of gravity)
  End
  Behavior = EjectPilotDie ModuleTag_04
    VeterancyLevels = ALL -REGULAR
    ExemptStatus = HIJACKED
    GroundCreationList = OCL_EjectPilotOnGround
    AirCreationList = OCL_EjectPilotViaParachute
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End

  Behavior = JetAIUpdate ModuleTag_06
    OutOfAmmoDamagePerSecond = 10.0%
    TakeoffDistForMaxLift = 0.0% ; larger numbers give more lift sooner when taking off
    TakeoffPause = 500
    MinHeight = 5.0
    ReturnToBaseIdleTime = 10000
  End

  Behavior = ExperienceScalarUpgrade ModuleTag_08
    TriggeredBy = Upgrade_AmericaAdvancedTraining
    AddXPScalar = 1.0
  End

  Behavior = StealthUpdate ModuleTag_09
    StealthDelay = 1500 ; in milliseconds
    StealthForbiddenConditions = FIRING_PRIMARY
    ; not currently used... but maybe someday? (srj)
    ; RevealDistanceFromTarget = 0.0
    FriendlyOpacityMin = 50.0%
    FriendlyOpacityMax = 100.0%
    InnateStealth = YES
    OrderIdleEnemiesToAttackMeUponReveal = YES
  End

  Behavior = ArmorUpgrade ModuleTag_Armor01
    TriggeredBy = Upgrade_AmericaCountermeasures
  End

  Behavior = CountermeasuresBehavior ModuleTag_10
    TriggeredBy = Upgrade_AmericaCountermeasures
    FlareTemplateName = CountermeasureFlare
    FlareBoneBaseName = Flare ; Name of the base flare bone (Flare01, Flare02, Flare03)
    VolleySize = 2 ; Number of flares launched per volley (requires bones)
    VolleyArcAngle = 60.0 ; Max angle of flare relative to forward direction (with a VolleySize of 1, the flare always goes straight back).
    VolleyVelocityFactor = 2.0 ; Shoots out flares at a stronger velocity with a higher value.
    DelayBetweenVolleys = 1000
    NumberOfVolleys = 3 ; Number of times the volleys will fire before reloading
    ReloadTime = 0 ; After all volleys are launched, then reloading must occur. If 0, then reloading only occurs at an Airfield.
    EvasionRate = 30.0% ; With active flares, the specified percentage will be diverted.
    ReactionLaunchLatency = 0 ; Reaction between getting shot at and the firing of the first volley of countermeasures.
    MissileDecoyDelay = 200 ; A reported missile that has been determined to hit a decoy will wait this long before acquiring countermeasures.
  End

  Locomotor = SET_NORMAL StealthJetLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_22
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_MIGDamageTransition
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 7.0
  GeometryMinorRadius = 7.0
  GeometryHeight = 7.0
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
