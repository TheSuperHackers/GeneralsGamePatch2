    MaxSpecialObjects = 10
    SpecialObjectsPersistWhenOwnerDies = YES
    SpecialObjectsPersistent = YES ; Charges are persistent till lifetime expires or the owner detonates them.
    UniqueSpecialObjectTargets = YES ; This prevents multiple charges from being placed on the same object.
    UnpackTime = 5500 ; NOTE: Modifying this value will require modifying the delay for ColonelBurtonPlantCharge
    FlipOwnerAfterUnpacking = YES
    FleeRangeAfterCompletion = 100.0 ; Runs away after finishing the ability
    UnpackSound = ColonelBurtonPlantCharge
    LoseStealthOnTrigger = YES
    PreTriggerUnstealthTime = 5000 ; in milliseconds
  End

  Behavior = ExperienceScalarUpgrade ModuleTag_12
