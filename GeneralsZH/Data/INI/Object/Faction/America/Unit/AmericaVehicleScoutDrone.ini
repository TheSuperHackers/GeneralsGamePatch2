Object AmericaVehicleScoutDrone
  ; *** ART Parameters ***
  SelectPortrait = SAScout_L
  ButtonImage = SAScout

  UpgradeCameo1 = Upgrade_AmericaDroneArmor

  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = AVScoutDr
      Animation = AVScoutDr.AVScoutDr
      AnimationMode = LOOP
    End

    ConditionState = REALLYDAMAGED
      Model = AVScoutDr_d
      Animation = AVScoutDr_d.AVScoutDr_d
      AnimationMode = LOOP
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:ScoutDrone
  Side = America
  EditorSorting = VEHICLE
  VisionRange = 150.0
  ShroudClearingRange = 500.0
  TransportSlotCount = 0
  ArmorSet
    Conditions = NONE
    Armor = TankArmor
    DamageFX = SmallTankDamageFX
  End
  BuildCost = 100
  BuildTime = 5.0 ; in seconds
  IsTrainable = NO

  ; *** AUDIO Parameters ***
  VoiceSelect = NoSound
  VoiceMove = NoSound
  VoiceAttack = NoSound
  SoundMoveStart = NoSound

  UnitSpecificSounds
    TurretMoveLoop = TurretMoveLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS VEHICLE SELECTABLE DRONE NO_SELECT

  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 60.0 ; turn rate, in degrees/sec
      ControlledWeaponSlots = PRIMARY
    End
    AutoAcquireEnemiesWhenIdle = YES
  End
  Locomotor = SET_NORMAL DroneLocomotor
  Behavior = StealthDetectorUpdate ModuleTag_04
    DetectionRate = 500 ; how often to rescan for stealthed things in my sight (milliseconds)
    ; DetectionRange = ??? ; Dustin, enable this for independent balancing!
    CanDetectWhileGarrisoned = NO
    CanDetectWhileContained = NO
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 50.0
    AllowBouncing = NO
    KillWhenRestingOnGround = YES
  End

  Behavior = SlavedUpdate ModuleTag_06
    GuardMaxRange = 35 ; How far away from master I'm allowed when master is idle (doesn't wander)
    GuardWanderRange = 35 ; How far away I'm allowed to wander from master while guarding.
    AttackRange = 75 ; How far away from master I'm allowed when master is attacking a target.
    AttackWanderRange = 10 ; How far I'm allowed to wander from the target.
    ScoutRange = 75 ; How far away from master I'm allowed when master is moving.
    ScoutWanderRange = 10 ; How far I'm allowed to wander from the scout point.
    DistToTargetToGrantRangeBonus = 20 ; How close I have to be to the master's target in order to grant master a range bonus.
    StayOnSameLayerAsMaster = YES
  End

  Behavior = MaxHealthUpgrade ModuleTag_07
    TriggeredBy = Upgrade_AmericaDroneArmor
    AddMaxHealth = 25.0
    ChangeType = ADD_CURRENT_HEALTH_TOO ; Choices are PRESERVE_RATIO, ADD_CURRENT_HEALTH_TOO, and SAME_CURRENTHEALTH
  End

  Behavior = DestroyDie ModuleTag_08
    DeathTypes = ALL
  End
  Behavior = CreateObjectDie ModuleTag_09
    DeathTypes = ALL
    CreationList = OCL_AmericaScoutDroneExplode
  End
  Behavior = FXListDie ModuleTag_10
    DeathTypes = ALL
    DeathFX = FX_AmericaScoutDroneExplode
  End

  Behavior = TransitionDamageFX ModuleTag_11
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_BattleDroneDamageTransitionSmall
  End

  Behavior = UpgradeDie ModuleTag_12
    ; This frees the object-based upgrade for the producer object.
    DeathTypes = ALL
    UpgradeToRemove = Upgrade_AmericaScoutDrone
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 5.0
  GeometryMinorRadius = 6.0
  GeometryHeight = 3.0
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
