  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:SupplyStash
  Side = GLA
  EditorSorting = STRUCTURE
  VisionRange = 200.0
  ShroudClearingRange = 200.0
  PlacementViewAngle = -45.0
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End
  ArmorSet
    Conditions = PLAYER_UPGRADE
    Armor = GLAUpgradedStructureArmor
    DamageFX = StructureDamageFXNoShake
  End
  BuildCost = 1500
  BuildTime = 10.0 ; in seconds
  RefundValue = 650 ; With nothing (or zero) listed, we sell for half price.
  EnergyProduction = 0
  ExperienceValue = 200 200 200 200
  CommandSet = GLASupplyStashCommandSet

  ; *** AUDIO Parameters ***
