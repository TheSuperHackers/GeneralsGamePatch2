; Note, this is really a Civ Dozer that's used only for eye-candy purposes.
; It doesn't have the mine-disarming ability. It probably shouldn't even have the Dozer
; ability, but I have left that in for now. But don't use this for true Dozer purposes.

Object GLAVehicleDozer
  ; *** ART Parameters ***
  SelectPortrait = SNDozer_L
  ButtonImage = SNDozer
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = AVCONSTDOZ
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Dozer
  Side = GLA
  EditorSorting = VEHICLE
  VisionRange = 150.0
  ShroudClearingRange = 300.0
  TransportSlotCount = 5

  ArmorSet
    Conditions = NONE
    Armor = TankArmor
    DamageFX = TankDamageFX
  End
  BuildCost = 100
  BuildTime = 5.0 ; in seconds
  CrusherLevel = 2 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  ; CommandSet = GLADozerCommandSet

  ; *** AUDIO Parameters ***
  SoundMoveStart = NoSound

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD VEHICLE SCORE SELECTABLE CAN_CAST_REFLECTIONS DOZER

  Body = ActiveBody ModuleTag_02
    MaxHealth = 1000.0
    InitialHealth = 1000.0
  End
  Behavior = DozerAIUpdate ModuleTag_03
    RepairHealthPercentPerSecond = 2.0%
    BoredTime = 5000.0 ; in milliseconds
    BoredRange = 150.0 ; when bored, we look this far away to do something
  End
  Locomotor = SET_NORMAL BasicTankLocomotor
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 75.0
  End

  Behavior = DestroyDie ModuleTag_05
    ; <NO DATA>
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Geometry = BOX
  GeometryMajorRadius = 15.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 15.0
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
