Object Nuke_ChinaTankECM
  ; *** ART Parameters ***
  SelectPortrait = SNbanshee_L
  ButtonImage = SNbanshee

  Draw = W3DTankDraw ModuleTag_01
    DefaultConditionState
      Model = NVBANSHEE
      Turret = TURRET01
    End
    ConditionState = REALLYDAMAGED
      Model = NVBANSHEE_D
    End
    ConditionState = RUBBLE
      Model = NVBANSHEE_D1
    End
    ExtraPublicBone = WEAPONA01
    OkToChangeModelColor = YES

    TrackMarks = EXTnkTrack.tga
    TreadAnimationRate = 4.0 ; amount of tread texture to move per second
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:ECMTank
  Side = ChinaNukeGeneral
  EditorSorting = VEHICLE
  VisionRange = 150.0
  ShroudClearingRange = 360.0
  TransportSlotCount = 3

  ArmorSet
    Conditions = NONE
    Armor = TankArmor
    DamageFX = TankDamageFX
  End
  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY ECMTankVehicleDisabler
  End
  Prerequisites
    Object = Nuke_ChinaWarFactory
    Object = Nuke_ChinaPropagandaCenter
  End
  BuildCost = 800
  BuildTime = 10.0 ; in seconds

  ExperienceValue = 50 50 100 150
  ExperienceRequired = 0 100 150 300
  IsTrainable = YES
  CrusherLevel = 2 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = ChinaVehicleECMTankCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = FrequencyJammerVoiceSelect
  VoiceMove = FrequencyJammerVoiceMove
  VoiceGuard = FrequencyJammerVoiceMove
  VoiceAttack = FrequencyJammerVoiceAttack
  SoundMoveStart = MicrowaveTankMoveStart
  SoundMoveStartDamaged = MicrowaveTankMoveStart

  UnitSpecificSounds
    VoiceCreate = FrequencyJammerVoiceCreate
    TurretMoveLoop = TurretMoveLoopLoud
    VoiceCrush = NoSound
    VoiceEnter = FrequencyJammerVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE CANNOT_RETALIATE

  Body = ActiveBody ModuleTag_02
    MaxHealth = 300.0
    InitialHealth = 300.0

    SubdualDamageCap = 600.0
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50.0
  End
  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 180.0 ; turn rate, in degrees/sec
      FiresWhileTurning = NO
      RecenterTime = 0
      MinIdleScanInterval = 0 ; in milliseconds
      MaxIdleScanInterval = 0 ; in milliseconds
      MinIdleScanAngle = 180.0 ; in degrees off the natural turret angle
      MaxIdleScanAngle = 180.0 ; in degrees off the natural turret angle
      ControlledWeaponSlots = PRIMARY
    End
    AutoAcquireEnemiesWhenIdle = NO
  End
  Locomotor = SET_NORMAL GattlingTankLocomotor
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 40.0
  End

  ; Just explode death
  Behavior = SlowDeathBehavior ModuleTag_05
    SinkRate = 0.5 ; in dist/sec
    ProbabilityModifier = 19
    DestructionDelay = 200
    DestructionDelayVariance = 100
    FX = FINAL FX_GattlingExplosionOneFinal
    OCL = FINAL OCL_ChinaTankECMDebris
  End

  Behavior = CreateCrateDie ModuleTag_06
    CrateData = SalvageCrateData
  End

  Behavior = TransitionDamageFX ModuleTag_07
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_BattleMasterDamageTransition
  End
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End

  Behavior = CommandButtonHuntUpdate ModuleTag_22 ; allows the use of the CommandButton Hunt script with this unit.
  End

  Behavior = FireWeaponUpdate ModuleTag_23
    Weapon = ECMTankMissileJammer
    ExclusiveWeaponDelay = 1000 ; If we fire a real weapon, we turn this module off for this long
  End

  Geometry = BOX
  GeometryMajorRadius = 15.0
  GeometryMinorRadius = 10.0

  GeometryHeight = 15.0
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
