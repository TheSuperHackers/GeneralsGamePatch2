Object Nuke_ChinaInfantryTankHunter
  ; *** ART Parameters ***
  SelectPortrait = SNTankHunter_L
  ButtonImage = SNTankHunter

  UpgradeCameo1 = Upgrade_Nationalism

  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = NIMSST_SKN
      WeaponFireFXBone = PRIMARY Muzzle
      WeaponMuzzleFlash = PRIMARY MuzzleFX
      WeaponLaunchBone = PRIMARY Muzzle
      WeaponLaunchBone = SECONDARY Muzzle
      IdleAnimation = NIMSST_SKL.NIMSST_STA 0.0 30
      IdleAnimation = NIMSST_SKL.NIMSST_IDA
      IdleAnimation = NIMSST_SKL.NIMSST_IDB
      AnimationMode = ONCE
      TransitionKey = TRANS_Stand
      AnimationSpeedFactorRange = 0.8 1.2
    End
    AliasConditionState = REALLYDAMAGED

    ConditionState = FIRING_A
      Animation = NIMSST_SKL.NIMSST_ATA
      AnimationMode = ONCE
      TransitionKey = TRANS_START_FIRING
    End
    AliasConditionState = REALLYDAMAGED FIRING_A

    ConditionState = BETWEEN_FIRING_SHOTS_A
      Animation = NIMSST_SKL.NIMSST_STA
      AnimationMode = ONCE
      ; this is basically a trick: this guy has a nontrivial animation for firing,
      ; and a long recycle time between shots. we want him to finish his fire animation
      ; (unless he's ordered to do something else), so this is just a handy trick that
      ; says, "if the previous state had this transition key, allow it to finish before
      ; switching to us, if possible".
      WaitForStateToFinishIfPossible = TRANS_START_FIRING
    End
    AliasConditionState = REALLYDAMAGED BETWEEN_FIRING_SHOTS_A

    ConditionState = MOVING
      Animation = NIMSST_SKL.NIMSST_RNA 20.0
      AnimationMode = LOOP
      ParticleSysBone = NONE InfantryDustTrails
    End
    AliasConditionState = REALLYDAMAGED MOVING
    AliasConditionState = MOVING ATTACKING
    AliasConditionState = MOVING ATTACKING REALLYDAMAGED

    ConditionState = RELOADING_A
      ; WeaponLaunchBone = PRIMARY WeaponA
      Animation = NIMSST_SKL.NIMSST_ATA 10.0
      AnimationMode = ONCE
    End
    AliasConditionState = MOVING RELOADING_A
    AliasConditionState = REALLYDAMAGED MOVING RELOADING_A

    ConditionState = DYING
      Animation = NIMSST_SKL.NIMSST_DTA
      Animation = NIMSST_SKL.NIMSST_DTB
      AnimationMode = ONCE
      TransitionKey = TRANS_Dying
      AnimationSpeedFactorRange = 0.9 1.25
    End
    AliasConditionState = DYING RUBBLE

    TransitionState = TRANS_Dying TRANS_Flailing
      Animation = NIMSST_SKL.NIMSST_ADTD1
      AnimationMode = ONCE
    End

    ConditionState = DYING EXPLODED_FLAILING
      Animation = NIMSST_SKL.NIMSST_ADTD2
      AnimationMode = LOOP
      TransitionKey = TRANS_Flailing
    End

    ConditionState = DYING EXPLODED_BOUNCING
      Animation = NIMSST_SKL.NIMSST_ADTD3
      AnimationMode = ONCE
    End

    ; PARACHUTING ANIMATIONS
    ConditionState = FREEFALL
      Animation = NIMSST_SKL.NIMSST_POP
      AnimationMode = ONCE
      TransitionKey = TRANS_Falling
    End
    AliasConditionState = FREEFALL REALLYDAMAGED
    AliasConditionState = FREEFALL DYING

    ConditionState = PARACHUTING
      Animation = NIMSST_SKL.NIMSST_PHG
      AnimationMode = LOOP
      TransitionKey = TRANS_Chute
      Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
    End
    AliasConditionState = PARACHUTING REALLYDAMAGED
    AliasConditionState = PARACHUTING DYING

    ; TransitionState = TRANS_Falling TRANS_Chute
    ;   Animation = NIMSST_SKL.NIMSST_POP
    ;   AnimationMode = ONCE
    ;   Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
    ; End

    TransitionState = TRANS_Chute TRANS_Stand
      Animation = NIMSST_SKL.NIMSST_PDN
      AnimationMode = ONCE
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TankHunter
  Side = ChinaNukeGeneral
  EditorSorting = INFANTRY
  VisionRange = 150.0
  ShroudClearingRange = 400.0
  TransportSlotCount = 1
  ArmorSet
    Conditions = NONE
    Armor = HumanArmor
    DamageFX = InfantryDamageFX
  End
  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY ChinaInfantryTankHunterMissileLauncher
  End
  Prerequisites
    Object = Nuke_ChinaBarracks
  End
  BuildCost = 350
  BuildTime = 7.0 ; in seconds

  ExperienceValue = 20 20 40 60
  ExperienceRequired = 0 100 200 400
  IsTrainable = YES
  CrushableLevel = 0 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = ChinaInfantryTankHunterCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = TankHunterVoiceSelect
  VoiceMove = TankHunterVoiceMove
  VoiceAttack = TankHunterVoiceAttack
  VoiceAttackAir = TankHunterVoiceAttack
  VoiceGuard = TankHunterVoiceMove
  VoiceFear = TankHunterVoiceFear
  UnitSpecificSounds
    VoiceCreate = TankHunterVoiceCreate
    VoiceGarrison = TankHunterVoiceGarrison
    VoiceEnter = TankHunterVoiceMove
    VoiceEnterHostile = TankHunterVoiceMove
    VoiceGetHealed = TankHunterVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS INFANTRY SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = YES
  End
  Locomotor = SET_NORMAL MissileDefenderLocomotor
  Behavior = HordeUpdate ModuleTag_04
    RubOffRadius = 60.0 ; if I am this close to a real hordesman, I will get to be an honorary hordesman
    UpdateRate = 1000 ; how often to recheck horde status (milliseconds)
    Radius = 30.0 ; how close other units must be to us to count towards our horde-ness (~30 feet or so)
    KindOf = INFANTRY ; what KindOfs must match to count towards horde-ness
    AlliesOnly = YES ; do we only count allies towards horde status?
    ExactMatch = NO ; do we only count units of our exact same type towards horde status? (overrides KindOf)
    Count = 5 ; how many units must be within Radius to grant us horde-ness
    Action = HORDE ; when horde-ing, grant us the HORDE bonus
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 5.0
  End

  Behavior = SpecialAbility ModuleTag_07
    SpecialPowerTemplate = SpecialAbilityTankHunterTNTAttack
    UpdateModuleStartsAttack = YES
    InitiateSound = TankHunterVoiceTNT
  End
  Behavior = SpecialAbilityUpdate ModuleTag_08
    SpecialPowerTemplate = SpecialAbilityTankHunterTNTAttack
    StartAbilityRange = 5.0
    PreparationTime = 0
    SpecialObject = TNTStickyBomb
    MaxSpecialObjects = 8
    SpecialObjectsPersistWhenOwnerDies = YES
    SpecialObjectsPersistent = YES ; Charges are persistent till lifetime expires or the owner detonates them.
    UniqueSpecialObjectTargets = YES ; This prevents multiple charges from being placed on the same object.
    FleeRangeAfterCompletion = 100.0 ; Runs away after finishing the ability
  End

  Behavior = SquishCollide ModuleTag_09
    ; <NO DATA>
  End

  Behavior = SlowDeathBehavior ModuleTag_Death01
    DeathTypes = ALL -CRUSHED -SPLATTED -EXPLODED -BURNED -POISONED -POISONED_BETA -POISONED_GAMMA
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_TankHunterDie
  End
  Behavior = SlowDeathBehavior ModuleTag_Death02
    DeathTypes = NONE +CRUSHED +SPLATTED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDieCrushed
  End
  Behavior = SlowDeathBehavior ModuleTag_Death03
    DeathTypes = NONE +EXPLODED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_TankHunterDie
    FlingForce = 8.0
    FlingForceVariance = 3.0
    FlingPitch = 60.0
    FlingPitchVariance = 10.0
  End
  Behavior = SlowDeathBehavior ModuleTag_Death04
    DeathTypes = NONE +BURNED
    DestructionDelay = 0
    FX = INITIAL FX_DieByFireChina
    OCL = INITIAL OCL_FlamingInfantry
  End
  Behavior = SlowDeathBehavior ModuleTag_Death05
    DeathTypes = NONE +POISONED
    DestructionDelay = 0
    FX = INITIAL FX_DieByToxinChina
    OCL = INITIAL OCL_ToxicInfantry
  End
  Behavior = SlowDeathBehavior ModuleTag_Death06
    DeathTypes = NONE +POISONED_BETA
    DestructionDelay = 0
    FX = INITIAL FX_DieByToxinChina
    OCL = INITIAL OCL_ToxicInfantryBeta
  End
  Behavior = SlowDeathBehavior ModuleTag_Death07
    DeathTypes = NONE +POISONED_GAMMA
    DestructionDelay = 0
    FX = INITIAL FX_DieByToxinGLA
    OCL = INITIAL OCL_ToxicInfantryGamma
  End

  Behavior = PoisonedBehavior ModuleTag_12
    PoisonDamageInterval = 100
    PoisonDuration = 3000
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 12.0
  GeometryIsSmall = YES
  Shadow = SHADOW_DECAL
  ShadowSizeX = 14.0
  ShadowSizeY = 14.0
  ShadowTexture = ShadowI
  BuildCompletion = APPEARS_AT_RALLY_POINT
End
