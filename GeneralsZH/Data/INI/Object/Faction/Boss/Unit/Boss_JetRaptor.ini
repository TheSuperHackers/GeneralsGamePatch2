Object Boss_JetRaptor
  ; *** ART Parameters ***
  SelectPortrait = SAKingRap_L
  ButtonImage = SAKingRap

  UpgradeCameo1 = Upgrade_AmericaLaserMissiles
  UpgradeCameo2 = Upgrade_AmericaAdvancedTraining

  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = AVRaptorAG
      HideSubObject = BurnerFX01 BurnerFX02
      WeaponLaunchBone = PRIMARY WeaponA
    End

    ConditionState = JETEXHAUST
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = JETEXHAUST JETAFTERBURNER
      ; afterburner
      ShowSubObject = BurnerFX01 BurnerFX02
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
      ParticleSysBone = Engine01 JetLenzflare
      ParticleSysBone = Engine02 JetLenzflare
    End

    ConditionState = REALLYDAMAGED
      Model = AVRaptorAG_D
      ; damage
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetEngineDamagedSmoke
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = AVRaptorAG_D
      ; damage
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetEngineDamagedSmoke
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
      Model = AVRaptorAG_D
      ; afterburner
      ShowSubObject = BurnerFX01 BurnerFX02
      ; damage
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Engine01 JetEngineDamagedSmoke
      ParticleSysBone = Engine01 JetLenzflare
      ParticleSysBone = Engine02 JetLenzflare
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End

    ConditionState = RUBBLE
      Model = AVRaptor_D1B
      ShowSubObject = NONE
      HideSubObject = NONE
    End

    ConditionState = RUBBLE JETEXHAUST JETAFTERBURNER
      Model = AVRaptor_D1B
      ShowSubObject = NONE
      ; HideSubObject is needed because they're inherited from the DefaultConditionState
      HideSubObject = NONE
      ParticleSysBone = Engine01 JetExhaust
      ParticleSysBone = Engine02 JetExhaust
      ; exhaust
      ParticleSysBone = Wingtip01 JetContrail
      ParticleSysBone = Wingtip02 JetContrail
    End
    ExtraPublicBone = WeaponA01
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:KingRaptor
  Side = Boss
  EditorSorting = VEHICLE
  VisionRange = 180.0
  ShroudClearingRange = 400.0
  TransportSlotCount = 0
  ArmorSet
    Conditions = NONE
    Armor = AirplaneArmor
    DamageFX = NONE
  End

  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY AirF_RaptorJetMissileWeapon
  End
  Prerequisites
    Object = Boss_Airfield
  End

  BuildCost = 1100
  BuildTime = 20.0
  ExperienceValue = 50 50 100 150
  ExperienceRequired = 0 100 200 400
  IsTrainable = YES
  CrusherLevel = 1 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = AmericaJetRaptorCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = RaptorVoiceSelect
  VoiceMove = RaptorVoiceMove
  VoiceAttack = RaptorVoiceAttack
  VoiceAttackAir = RaptorVoiceAttackAir
  VoiceGuard = RaptorVoiceAirPatrol
  SoundAmbient = RaptorAmbientLoop
  SoundAmbientRubble = NoSound
  ; SoundMoveLoop = RaptorAmbientLoop ; don't want sound while sitting at the Airfield
  UnitSpecificSounds
    VoiceCreate = RaptorVoiceCreate
    SoundEject = PilotSoundEject
    VoiceEject = PilotVoiceEject
    Afterburner = RaptorAfterburner
    VoiceLowFuel = RaptorVoiceLowFuel
    VoiceGarrison = RaptorVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body = ActiveBody ModuleTag_02
    MaxHealth = 160.0
    InitialHealth = 160.0
  End

  Behavior = ExperienceScalarUpgrade ModuleTag_04
    TriggeredBy = Upgrade_AmericaAdvancedTraining
    AddXPScalar = 1.0
  End

  Behavior = JetSlowDeathBehavior ModuleTag_05
    DestructionDelay = 99999999
    FXOnGroundDeath = FX_JetOnGroundDeath
    OCLOnGroundDeath = OCL_RaptorDeathFinalBlowUp
    FXInitialDeath = FX_RaptorDeathInitial
    OCLInitialDeath = OCL_RaptorDeathInitial
    DelaySecondaryFromInitialDeath = 500 ; in milliseconds
    FXSecondary = FX_JetDeathSecondary
    OCLSecondary = OCL_RaptorDeathSecondary
    FXHitGround = FX_JetDeathHitGround
    OCLHitGround = OCL_RaptorDeathHitGround
    DelayFinalBlowUpFromHitGround = 200 ; in milliseconds
    FXFinalBlowUp = FX_JetDeathFinalBlowUp
    OCLFinalBlowUp = OCL_RaptorDeathFinalBlowUp
    ; DeathLoopSound = MICAL NEEDS TO MAKE ME
    RollRate = 0.2
    RollRateDelta = 100.0% ; each frame, rollrate = rollrate * rollrateDelta
    PitchRate = 0.0
    FallHowFast = 110.0% ; Bigger is faster (can be over 100%; it's a fraction of gravity)
  End
  Behavior = EjectPilotDie ModuleTag_06
    VeterancyLevels = ALL -REGULAR
    ExemptStatus = HIJACKED
    GroundCreationList = OCL_EjectPilotOnGround
    AirCreationList = OCL_EjectPilotViaParachute
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 500.0
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_MIGDamageTransition
  End

  Behavior = JetAIUpdate ModuleTag_09
    OutOfAmmoDamagePerSecond = 10.0%
    TakeoffDistForMaxLift = 0.0% ; larger numbers give more lift sooner when taking off
    TakeoffPause = 500
    MinHeight = 5.0
    ParkingOffset = 3.0 ; scooch it a little forward so the tail doesn't hit the doors
    ReturnToBaseIdleTime = 10000
  End
  Locomotor = SET_NORMAL RaptorJetLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End
  Behavior = PointDefenseLaserUpdate ModuleTag_22
    WeaponTemplate = AirF_RaptorPointDefenseLaser
    PrimaryTargetTypes = BALLISTIC_MISSILE SMALL_MISSILE
    ScanRate = 10
    ScanRange = 200.0
    PredictTargetVelocityFactor = 2.0
  End
  Behavior = StealthDetectorUpdate ModuleTag_24
    DetectionRate = 500 ; how often to rescan for stealthed things in my sight (milliseconds)
    ; DetectionRange = ??? ; Dustin, enable this for independent balancing!
    CanDetectWhileGarrisoned = NO
    CanDetectWhileContained = NO
  End

  Geometry = BOX
  GeometryMajorRadius = 14.0
  GeometryMinorRadius = 7.0
  GeometryHeight = 5.0
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
