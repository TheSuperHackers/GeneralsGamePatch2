  End

  Behavior = AIUpdateInterface ModuleTag_07
  End
  Locomotor = SET_NORMAL 18WheelerLocomotor

  Behavior = PhysicsBehavior ModuleTag_08
    Mass = 30.0
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
