Object NuclearBunker
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ; day
    ConditionState = NONE
      Model = CBNukeBunk2
    End
    ConditionState = DAMAGED
      Model = CBNukeBunk2_D
    End
    ConditionState = REALLYDAMAGED
      Model = CBNukeBunk2_E
    End
    ConditionState = RUBBLE
      Model = CBNukeBunk2_R
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Bunker
  EditorSorting = STRUCTURE
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End

  ; *** AUDIO Parameters ***
  SoundOnDamaged = BuildingDamagedStateLight
  SoundOnReallyDamaged = BuildingDestroy

  ; *** ENGINEERING Parameters ***
  RadarPriority = STRUCTURE
  KindOf = STRUCTURE SELECTABLE IMMOBILE
  Body = StructureBody ModuleTag_02
    MaxHealth = 2000.0
    InitialHealth = 2000.0
  End

  Behavior = FlammableUpdate ModuleTag_05
    FlameDamageLimit = 20.0
    FlameDamageExpiration = 2000
    AflameDuration = 5000
    AflameDamageAmount = 25
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_06
    DamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke

    ReallyDamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumShockwave

    RubbleParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke
    RubbleParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumExplosion
    RubbleParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumShockwave
    RubbleParticleSystem4 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumFlare
  End

  ; Note that structures with "RUBBLE" states should not use DestroyDie; such buildings are
  ; never truly destroyed, even when reduced to zero health. Also note that garrisonable
  ; buildings automatically stick around because GarrisonContain has its own DieModule
  Behavior = KeepObjectDie ModuleTag_IWantRubble
  End

  Behavior = InstantDeathBehavior ModuleTag_07
    FX = FX_BuildingDie
    Weapon = ChinaPowerPlantDeathWeapon
  End

  Geometry = BOX
  GeometryMajorRadius = 48.0
  GeometryMinorRadius = 66.0
  GeometryHeight = 22.0
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
End
