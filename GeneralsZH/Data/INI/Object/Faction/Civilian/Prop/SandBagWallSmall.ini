Object SandBagWallSmall
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = CBSandBW3s
    End
    ConditionState = DAMAGED
      Model = CBSandBW3s_D
    End
    ConditionState = REALLYDAMAGED
      Model = CBSandBW3s_D
    End
    ConditionState = RUBBLE
      Model = CBSandBW3s_E
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:SandBagWall
  EditorSorting = MISC_MAN_MADE

  ; *** ENGINEERING Parameters ***
  KindOf = IMMOBILE LOW_OVERLAPPABLE FORCEATTACKABLE CAN_SEE_THROUGH_STRUCTURE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 1.0
    InitialHealth = 1.0
  End

  Behavior = ToppleUpdate ModuleTag_03
    ToppleFX = FX_SandWallTopple
    ToppleLeftOrRightOnly = YES
    ReorientToppledRubble = YES
    BounceVelocityPercent = 0.0% ; most walls shouldn't bounce at all (default: 30%)
    InitialAccelPercent = 3.0% ; fences accelerate faster than trees (default: 1%)
  End
  Behavior = SlowDeathBehavior ModuleTag_04
    SinkDelay = 5000
    SinkRate = 2.0 ; in dist/sec
    DestructionDelay = 10000
  End

  Geometry = BOX
  GeometryMajorRadius = 9.5
  GeometryMinorRadius = 5.0
  GeometryHeight = 10.0
  GeometryIsSmall = NO
  FenceWidth = 15.0 ; Spacing used by the fence tool in worldbuilder.
  FenceXOffset = 0.0 ; Offset used by the fence tool in worldbuilder so corners line up.
  Shadow = SHADOW_VOLUME
End
