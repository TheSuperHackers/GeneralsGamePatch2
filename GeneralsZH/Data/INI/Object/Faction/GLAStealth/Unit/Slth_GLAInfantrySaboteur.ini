Object Slth_GLAInfantrySaboteur
  ; *** ART Parameters ***
  SelectPortrait = SUSaboteur_L
  ButtonImage = SUSaboteur

  Draw = W3DModelDraw ModuleTag_01
    ; standing
    DefaultConditionState
      Model = UISabotr_SKN
      IdleAnimation = UIWRKR_SKL.UIWRKR_STA 0.0 9
      IdleAnimation = UIWRKR_SKL.UIWRKR_IDA
      AnimationMode = ONCE
      TransitionKey = TRANS_Stand
    End

    ConditionState = MOVING
      Animation = UIWRKR_SKL.UIWRKR_RNA 16.0
      AnimationMode = LOOP
      TransitionKey = TRANS_Moving
      ParticleSysBone = NONE InfantryDustTrails
    End

    ConditionState = DYING
      Animation = UIWRKR_SKL.UIWRKR_DTA
      AnimationMode = ONCE
      TransitionKey = TRANS_Dying
    End

    TransitionState = TRANS_Dying TRANS_Flailing
      Animation = UIWRKR_SKL.UIWRKR_ADTE1
      AnimationMode = ONCE
    End

    ConditionState = DYING EXPLODED_FLAILING
      Animation = UIWRKR_SKL.UIWRKR_ADTE2
      AnimationMode = LOOP
      TransitionKey = TRANS_Flailing
    End

    ConditionState = DYING EXPLODED_BOUNCING
      Animation = UIWRKR_SKL.UIWRKR_ADTE3
      AnimationMode = ONCE
    End

    ConditionState = SPECIAL_CHEERING
      Animation = UIWRKR_SKL.UIWRKR_CHA
      AnimationMode = ONCE
    End

    OkToChangeModelColor = YES

    ; this says "we don't use these condition states at all, so completely
    ; ignore them for purposes of matchmaking"... this is useful to help
    ; reduce the number of AliasConditionState clauses you must add in
    ; order to avoid ambiguity in some cases.
    IgnoreConditionStates = PREATTACK_A FIRING_A BETWEEN_FIRING_SHOTS_A RELOADING_A
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Saboteur
  Side = GLAStealthGeneral
  EditorSorting = INFANTRY
  VisionRange = 150.0
  ShroudClearingRange = 300.0
  TransportSlotCount = 1

  ArmorSet
    Conditions = NONE
    Armor = HumanArmor
    DamageFX = InfantryDamageFX
  End
  Prerequisites
    Object = Slth_GLAArmsDealer
  End
  BuildCost = 800
  BuildTime = 15.0 ; in seconds

  ExperienceValue = 15 15 30 40
  ExperienceRequired = 0 40 60 120
  IsTrainable = YES
  CrushableLevel = 0 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = GLAInfantrySaboteurCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = SaboteurVoiceSelect
  VoiceMove = SaboteurVoiceMove
  VoiceGuard = SaboteurVoiceMove
  VoiceAttack = SaboteurVoiceAttack
  SoundStealthOn = StealthOn
  SoundStealthOff = StealthOff
  VoiceFear = SaboteurVoiceFear
  VoiceTaskComplete = NoSound
  UnitSpecificSounds
    VoiceCreate = SaboteurVoiceCreate
    VoiceSubdue = SaboteurVoiceMove
    VoiceGarrison = SaboteurVoiceMove
    VoiceEnter = SaboteurVoiceMove
    VoiceEnterHostile = SaboteurVoiceAttack
    VoiceGetHealed = SaboteurVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS INFANTRY SALVAGER SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth = 120.0
    InitialHealth = 120.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = YES
  End

  Behavior = CommandButtonHuntUpdate ModuleTag_04 ; allows the use of the CommandButton Hunt script with this unit.
  End

  Locomotor = SET_NORMAL SaboteurGroundLocomotor SaboteurCliffLocomotor

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 5.0
  End
  Behavior = StealthUpdate ModuleTag_07
    StealthDelay = 2500 ; in milliseconds
    StealthForbiddenConditions = NONE
    InnateStealth = YES
    OrderIdleEnemiesToAttackMeUponReveal = YES
  End

  Behavior = SquishCollide ModuleTag_11
    ; <NO DATA>
  End

  Behavior = SabotagePowerPlantCrateCollide SabotageTag_01
    BuildingPickup = YES
    SabotagePowerDuration = 30000
  End
  ; Behavior = SabotageSupplyDropzoneCrateCollide SabotageTag_02
  ;   BuildingPickup = YES
  ;   StealCashAmount = 800
  ; End
  Behavior = SabotageSuperweaponCrateCollide SabotageTag_03
    BuildingPickup = YES
  End
  Behavior = SabotageCommandCenterCrateCollide SabotageTag_04
    BuildingPickup = YES
  End
  Behavior = SabotageSupplyCenterCrateCollide SabotageTag_05
    BuildingPickup = YES
    StealCashAmount = 1000
  End
  Behavior = SabotageMilitaryFactoryCrateCollide SabotageTag_06
    BuildingPickup = YES
    SabotageDuration = 30000
  End

  Behavior = SlowDeathBehavior ModuleTag_Death01
    DeathTypes = ALL -CRUSHED -SPLATTED -EXPLODED -BURNED -POISONED -POISONED_BETA -POISONED_GAMMA
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_RebelDie
  End
  Behavior = SlowDeathBehavior ModuleTag_Death02
    DeathTypes = NONE +CRUSHED +SPLATTED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDieCrushed
  End
  Behavior = SlowDeathBehavior ModuleTag_Death03
    DeathTypes = NONE +EXPLODED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_RebelDie
    FlingForce = 8.0
    FlingForceVariance = 3.0
    FlingPitch = 60.0
    FlingPitchVariance = 10.0
  End
  Behavior = SlowDeathBehavior ModuleTag_Death04
    DeathTypes = NONE +BURNED
    DestructionDelay = 0
    FX = INITIAL FX_DieByFireGLA
    OCL = INITIAL OCL_FlamingInfantry
  End
  Behavior = SlowDeathBehavior ModuleTag_Death05
    DeathTypes = NONE +POISONED
    DestructionDelay = 0
    FX = INITIAL FX_DieByToxinGLA
    OCL = INITIAL OCL_ToxicInfantry
  End
  Behavior = SlowDeathBehavior ModuleTag_Death06
    DeathTypes = NONE +POISONED_BETA
    DestructionDelay = 0
    FX = INITIAL FX_DieByToxinGLA
    OCL = INITIAL OCL_ToxicInfantryBeta
  End
  Behavior = SlowDeathBehavior ModuleTag_Death07
    DeathTypes = NONE +POISONED_GAMMA
    DestructionDelay = 0
    FX = INITIAL FX_DieByToxinGLA
    OCL = INITIAL OCL_ToxicInfantryGamma
  End

  Behavior = PoisonedBehavior ModuleTag_16
    PoisonDamageInterval = 100
    PoisonDuration = 3000
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 12.0
  GeometryIsSmall = YES
  Shadow = SHADOW_DECAL
  ShadowSizeX = 14.0
  ShadowSizeY = 14.0
  ShadowTexture = ShadowI
  BuildCompletion = APPEARS_AT_RALLY_POINT
End
