Object GenericOptTree ; optimized client-side tree.
  ; *** ART Parameters ***
  Draw = W3DTreeDraw ModuleTag_01
    ModelName = PTDogwod01
    TextureName = PTDogwod01.tga

    DoTopple = YES
    DoShadow = YES
    ToppleFX = FX_ToppleTree
    BounceFX = FX_OptTreeBounce
    SinkDistance = 10.0
    SinkTime = 5000
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:DogwoodTree
  EditorSorting = SHRUBBERY
  CrushableLevel = 1

  ; *** ENGINEERING Parameters ***
  KindOf = SHRUBBERY IMMOBILE IGNORED_IN_GUI OPTIMIZED_TREE

  InstanceScaleFuzziness = 0.1
  Geometry = CYLINDER
  GeometryMajorRadius = 4.0
  GeometryHeight = 15.0
  GeometryIsSmall = YES
  Shadow = SHADOW_DECAL
End

