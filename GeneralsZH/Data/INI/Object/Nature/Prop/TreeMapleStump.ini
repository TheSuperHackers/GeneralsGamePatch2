Object TreeMapleStump
  ; *** ART Parameters ***
  Draw = W3DTreeDraw ModuleTag_01
    ModelName = PTStumpMpl
    TextureName = PTMaple02.tga

    DoTopple = YES
    DoShadow = YES
    ToppleFX = FX_ToppleTree
    BounceFX = FX_OptTreeBounce
    SinkDistance = 10.0
    SinkTime = 5000
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TreeStump
  EditorSorting = SHRUBBERY
  KindOf = NO_COLLIDE SHRUBBERY IMMOBILE IGNORED_IN_GUI OPTIMIZED_TREE

  Body = HighlanderBody ModuleTag_05 ; Can take damage, but won't die. Can only die from ::kill() or other unresistible damage
    MaxHealth = 1.0
    InitialHealth = 1.0
  End
  Behavior = SlowDeathBehavior ModuleTag_04
    SinkDelay = 14000
    SinkRate = 2.0 ; in dist/sec
    DestructionDelay = 17000
  End
  Behavior = LifetimeUpdate ModuleTag_03
    MinLifetime = 0 ; min lifetime in milliseconds
    MaxLifetime = 0 ; max lifetime in milliseconds
  End
End
