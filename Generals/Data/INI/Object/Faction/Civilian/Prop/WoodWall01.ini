Object WoodWall01
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = PMWallWd1
    End
    ConditionState = DAMAGED
      Model = PMWallWd1_D
    End
    AliasConditionState = REALLYDAMAGED
    ConditionState = SNOW
      Model = PMWallWd1_S
    End
    ConditionState = DAMAGED SNOW
      Model = PMWallWd1_D
    End
    AliasConditionState = REALLYDAMAGED SNOW
    ConditionState = RUBBLE
      Model = PMWallWd1_R
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:WoodWall
  EditorSorting = MISC_MAN_MADE

  ; *** ENGINEERING Parameters ***
  KindOf = IMMOBILE FORCEATTACKABLE CLEARED_BY_BUILD
  Body = ActiveBody ModuleTag_02
    MaxHealth = 1.0
    InitialHealth = 1.0
  End

  Behavior = ToppleUpdate ModuleTag_03
    ToppleFX = FX_WoodWallTopple
    ToppleLeftOrRightOnly = YES
    ReorientToppledRubble = YES
    BounceVelocityPercent = 0.0% ; most walls shouldn't bounce at all (default: 30%)
    InitialAccelPercent = 3.0% ; fences accelerate faster than trees (default: 1%)
  End
  Behavior = SlowDeathBehavior ModuleTag_04
    SinkDelay = 5000
    SinkRate = 2.0 ; in dist/sec
    DestructionDelay = 10000
  End

  Geometry = BOX
  GeometryMajorRadius = 15.0
  GeometryMinorRadius = 1.0
  GeometryHeight = 10.0
  GeometryIsSmall = NO
  FenceWidth = 29.0 ; Spacing used by the fence tool in worldbuilder.
  FenceXOffset = 0.0 ; Offset used by the fence tool in worldbuilder so corners line up.
  Shadow = SHADOW_VOLUME
End
