Object PicketFence01
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = PMWalPckt1
    End
    ConditionState = DAMAGED
      Model = PMWalPckt1_D
    End
    AliasConditionState = REALLYDAMAGED
    AliasConditionState = RUBBLE
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:PicketFence
  EditorSorting = MISC_MAN_MADE

  ; *** ENGINEERING Parameters ***
  KindOf = IMMOBILE FORCEATTACKABLE CAN_SEE_THROUGH_STRUCTURE CLEARED_BY_BUILD
  Body = ActiveBody ModuleTag_02
    MaxHealth = 1.0
    InitialHealth = 1.0
  End

  Behavior = ToppleUpdate ModuleTag_03
    ToppleFX = FX_WoodWallTopple
    ToppleLeftOrRightOnly = YES
    BounceVelocityPercent = 0.0% ; picket fences don't bounce (default: 30%)
    InitialAccelPercent = 3.0% ; fences accelerate faster than trees (default: 1%)
  End
  Behavior = SlowDeathBehavior ModuleTag_04
    DeathTypes = NONE +TOPPLED
    SinkDelay = 5000
    SinkRate = 2.0 ; in dist/sec
    DestructionDelay = 10000
  End
  Behavior = DestroyDie ModuleTag_05
    DeathTypes = ALL -TOPPLED
  End

  Geometry = BOX
  GeometryMajorRadius = 16.0
  GeometryMinorRadius = 1.0
  GeometryHeight = 10.0
  GeometryIsSmall = NO
  FenceWidth = 32.75 ; Spacing used by the fence tool in worldbuilder.
  FenceXOffset = 0.0 ; Offset used by the fence tool in worldbuilder so corners line up.
  Shadow = SHADOW_VOLUME
End
