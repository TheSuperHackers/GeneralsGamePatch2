Object MogadishuWell
  ; This should probably be a prop. -GB

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = CBMogWell
    End

    ; day garrisoned
    ConditionState = GARRISONED
      Model = CBMogWell
    End
    ConditionState = DAMAGED GARRISONED
      Model = CBMogWell
    End
    ConditionState = REALLYDAMAGED GARRISONED
      Model = CBMogWell
    End
    ; ConditionState = RUBBLE GARRISONED
    ;   Model = CBMogWell
    ; End

    ; night garrisoned
    ConditionState = NIGHT GARRISONED
      Model = CBMogWell
    End
    ConditionState = DAMAGED NIGHT GARRISONED
      Model = CBMogWell
    End
    ConditionState = REALLYDAMAGED NIGHT GARRISONED
      Model = CBMogWell
    End
    ; ConditionState = RUBBLE NIGHT GARRISONED
    ;   Model = CBMogWell
    ; End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Well
  EditorSorting = STRUCTURE
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End

  ; *** ENGINEERING Parameters ***
  KindOf = STRUCTURE SELECTABLE IMMOBILE
  Body = StructureBody ModuleTag_02
    MaxHealth = 2000.0
    InitialHealth = 2000.0
  End

  Behavior = FlammableUpdate ModuleTag_04
    FlameDamageLimit = 20.0
    FlameDamageExpiration = 2000
    AflameDuration = 5000
    AflameDamageAmount = 25
    AflameDamageDelay = 500
  End

  ; Note that structures with "RUBBLE" states should not use DestroyDie; such buildings are
  ; never truly destroyed, even when reduced to zero health. Also note that garrisonable
  ; buildings automatically stick around because GarrisonContain has its own DieModule
  Behavior = KeepObjectDie ModuleTag_IWantRubble
  End

  Geometry = BOX
  GeometryMajorRadius = 20.0
  GeometryMinorRadius = 20.0
  GeometryHeight = 4.0
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
End
