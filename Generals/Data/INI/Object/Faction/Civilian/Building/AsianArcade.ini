Object AsianArcade
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ; day
    ConditionState = NONE
      Model = CBNArcade
      Animation = CBNArcade.CBNArcade
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED
      Model = CBNArcade_D
      Animation = CBNArcade_D.CBNArcade_D
      AnimationMode = LOOP
    End
    ConditionState = REALLYDAMAGED
      Model = CBNArcade_E
    End
    ConditionState = RUBBLE
      Model = CBNArcade_R
    End

    ; day garrisoned
    ConditionState = GARRISONED
      Model = CBNArcade_G
      Animation = CBNArcade_G.CBNArcade_G
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED GARRISONED
      Model = CBNArcade_DG
      Animation = CBNArcade_DG.CBNArcade_DG
      AnimationMode = LOOP
    End

    ; night
    ConditionState = NIGHT
      Model = CBNArcade_N
      Animation = CBNArcade_N.CBNArcade_N
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED NIGHT
      Model = CBNArcade_DN
      Animation = CBNArcade_DN.CBNArcade_DN
      AnimationMode = LOOP
    End
    ConditionState = REALLYDAMAGED NIGHT
      Model = CBNArcade_EN
    End
    ConditionState = RUBBLE NIGHT
      Model = CBNArcade_RN
    End

    ; night garrisoned
    ConditionState = NIGHT GARRISONED
      Model = CBNArcade_NG
      Animation = CBNArcade_NG.CBNArcade_NG
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED NIGHT GARRISONED
      Model = CBNArcade_DNG
      Animation = CBNArcade_DNG.CBNArcade_DNG
      AnimationMode = LOOP
    End

    ; snow
    ConditionState = SNOW
      Model = CBNArcade_S
    End
    ConditionState = DAMAGED SNOW
      Model = CBNArcade_DS
    End
    ConditionState = REALLYDAMAGED SNOW
      Model = CBNArcade_ES
    End
    ConditionState = RUBBLE SNOW
      Model = CBNArcade_RS
    End

    ; snow garrisoned
    ConditionState = SNOW GARRISONED
      Model = CBNArcade_SG
      Animation = CBNArcade_SG.CBNArcade_SG
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED SNOW GARRISONED
      Model = CBNArcade_DSG
      Animation = CBNArcade_DSG.CBNArcade_DSG
      AnimationMode = LOOP
    End

    ; night snow
    ConditionState = SNOW NIGHT
      Model = CBNArcade_SN
    End
    ConditionState = DAMAGED SNOW NIGHT
      Model = CBNArcade_DSN
    End
    ConditionState = REALLYDAMAGED SNOW NIGHT
      Model = CBNArcade_ESN
    End
    ConditionState = RUBBLE SNOW NIGHT
      Model = CBNArcade_RSN
    End

    ; night snow garrisoned
    ConditionState = SNOW NIGHT GARRISONED
      Model = CBNArcade_SNG
      Animation = CBNArcade_SNG.CBNArcade_SNG
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED SNOW NIGHT GARRISONED
      Model = CBNArcade_DSNG
      Animation = CBNArcade_DSNG.CBNArcade_DSNG
      AnimationMode = LOOP
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Structure
  EditorSorting = STRUCTURE
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End

  ; *** AUDIO Parameters ***
  SoundDie = BuildingDie
  SoundOnDamaged = BuildingDamagedStateLight
  SoundOnReallyDamaged = BuildingDestroy

  ; *** ENGINEERING Parameters ***
  RadarPriority = STRUCTURE
  KindOf = STRUCTURE SELECTABLE IMMOBILE
  Body = StructureBody ModuleTag_02
    MaxHealth = 2000.0
    InitialHealth = 2000.0
  End
  Behavior = GarrisonContain ModuleTag_03
    ContainMax = 10
    EnterSound = GarrisonEnter
    ExitSound = GarrisonExit
  End

  Behavior = FlammableUpdate ModuleTag_05
    FlameDamageLimit = 20.0
    FlameDamageExpiration = 2000
    AflameDuration = 5000
    AflameDamageAmount = 25
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_06
    DamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallSmoke

    ReallyDamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallSmoke
    ReallyDamagedParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallExplosion
    ReallyDamagedParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallShockwave

    RubbleParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallSmoke
    RubbleParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallExplosion
    RubbleParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallShockwave
    RubbleParticleSystem4 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallFlare
  End

  ; Note that structures with "RUBBLE" states should not use
  ; DestroyDie; such buildings are never truly
  ; destroyed, even when reduced to zero health.
  Geometry = BOX
  GeometryMajorRadius = 20.0
  GeometryMinorRadius = 14.0
  GeometryHeight = 45.0
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
End
