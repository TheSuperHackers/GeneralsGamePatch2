Object CivilianTEROutPost
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ; day
    ConditionState = NONE
      Model = CBTOutpost
    End
    ConditionState = DAMAGED
      Model = CBTOutpost_D
    End
    ConditionState = REALLYDAMAGED
      Model = CBTOutpost_E
    End
    ConditionState = RUBBLE
      Model = CBTOutpost_R
    End

    ; day garrisoned
    ConditionState = GARRISONED
      Model = CBTOutpost_G
      Animation = CBTOutpost_G.CBTOutpost_G
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED GARRISONED
      Model = CBTOutpost_DG
      Animation = CBTOutpost_DG.CBTOutpost_DG
      AnimationMode = LOOP
    End

    ; night
    ConditionState = NIGHT
      Model = CBTOutpost_N
    End
    ConditionState = DAMAGED NIGHT
      Model = CBTOutpost_DN
    End
    ConditionState = REALLYDAMAGED NIGHT
      Model = CBTOutpost_EN
    End
    ConditionState = RUBBLE NIGHT
      Model = CBTOutpost_RN
    End

    ; night garrisoned
    ConditionState = NIGHT GARRISONED
      Model = CBTOutpost_NG
      Animation = CBTOutpost_NG.CBTOutpost_NG
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED NIGHT GARRISONED
      Model = CBTOutpost_DNG
      Animation = CBTOutpost_DNG.CBTOutpost_DNG
      AnimationMode = LOOP
    End

    ; snow
    ConditionState = SNOW
      Model = CBTOutpost_S
    End
    ConditionState = DAMAGED SNOW
      Model = CBTOutpost_DS
    End
    ConditionState = REALLYDAMAGED SNOW
      Model = CBTOutpost_ES
    End
    ConditionState = RUBBLE SNOW
      Model = CBTOutpost_RS
    End

    ; snow garrisoned
    ConditionState = SNOW GARRISONED
      Model = CBTOutpost_SG
      Animation = CBTOutpost_SG.CBTOutpost_SG
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED SNOW GARRISONED
      Model = CBTOutpost_DSG
      Animation = CBTOutpost_DSG.CBTOutpost_DSG
      AnimationMode = LOOP
    End

    ; night snow
    ConditionState = SNOW NIGHT
      Model = CBTOutpost_SN
    End
    ConditionState = DAMAGED SNOW NIGHT
      Model = CBTOutpost_DSN
    End
    ConditionState = REALLYDAMAGED SNOW NIGHT
      Model = CBTOutpost_ESN
    End
    ConditionState = RUBBLE SNOW NIGHT
      Model = CBTOutpost_RSN
    End

    ; night snow garrisoned
    ConditionState = SNOW NIGHT GARRISONED
      Model = CBTOutpost_SNG
      Animation = CBTOutpost_SNG.CBTOutpost_SNG
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED SNOW NIGHT GARRISONED
      Model = CBTOutpost_DSNG
      Animation = CBTOutpost_DSNG.CBTOutpost_DSNG
      AnimationMode = LOOP
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Structure
  EditorSorting = STRUCTURE
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End

  ; *** AUDIO Parameters ***
  SoundDie = BuildingDie
  SoundOnDamaged = BuildingDamagedStateLight
  SoundOnReallyDamaged = BuildingDestroy

  ; *** ENGINEERING Parameters ***
  RadarPriority = STRUCTURE
  KindOf = STRUCTURE SELECTABLE IMMOBILE
  Body = StructureBody ModuleTag_02
    MaxHealth = 2000.0
    InitialHealth = 2000.0
  End

  Behavior = FlammableUpdate ModuleTag_05
    FlameDamageLimit = 20.0
    FlameDamageExpiration = 2000
    AflameDuration = 5000
    AflameDamageAmount = 25
    AflameDamageDelay = 500
  End

  Behavior = TransitionDamageFX ModuleTag_06
    DamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke

    ReallyDamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumShockwave

    RubbleParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke
    RubbleParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumExplosion
    RubbleParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumShockwave
    RubbleParticleSystem4 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumFlare
  End

  ; Note that structures with "RUBBLE" states should not use DestroyDie; such buildings are
  ; never truly destroyed, even when reduced to zero health. Also note that garrisonable
  ; buildings automatically stick around because GarrisonContain has its own DieModule
  ; Behavior = KeepObjectDie ModuleTag_IWantRubble
  ; End

  Behavior = GarrisonContain ModuleTag_10
    ContainMax = 10
    EnterSound = GarrisonEnter
    ExitSound = GarrisonExit
  End

  Geometry = BOX
  GeometryMajorRadius = 33.0
  GeometryMinorRadius = 39.0
  GeometryHeight = 20.0
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
End
