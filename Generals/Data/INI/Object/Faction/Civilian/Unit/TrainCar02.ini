Object TrainCar02
  ; *** ART Parameters ***

  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = CVTrnBox02
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TrainCar
  EditorSorting = VEHICLE
  VisionRange = 300.0
  ShroudClearingRange = 300.0
  TransportSlotCount = 0

  ArmorSet
    Armor = TruckArmor
    DamageFX = CrushableCarDamageFX
  End
  CrusherLevel = 4 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 4 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles

  ; *** ENGINEERING Parameters ***
  KindOf = SELECTABLE CAN_ATTACK VEHICLE TRANSPORT

  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  ; Behavior = GarrisonContain ModuleTag_03
  ;   ContainMax = 10
  ;   EnterSound = GarrisonEnter
  ;   ExitSound = GarrisonExit
  ;   DamagePercentToUnits = 50.0%
  ;   MobileGarrison = YES
  ; End

  Behavior = RailroadBehavior ModuleTag_04
    IsLocomotive = NO
    PathPrefixName = Railroad

    ; PARAMETERS FOR ALL CARRIAGES
    RunningGarrisonSpeedMax = 1.0
    KillSpeedMin = 1.0
    Friction = 0.995
    BigMetalBounceSound = BuildingFallingMetal
    SmallMetalBounceSound = VehicleImpactHeavy
    MeatyBounceSound = InfantryCrush
    ClicketyClackSound = TrainClicketyClack
  End

  Behavior = DestroyDie ModuleTag_05
    ; <NO DATA>
  End
  Behavior = CreateObjectDie ModuleTag_06
    CreationList = OCL_TankerTruckExplode
  End
  Behavior = FXListDie ModuleTag_07
    DeathFX = FX_RailroadWoodenCarExplode
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End

  Geometry = BOX
  GeometryMajorRadius = 28.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 20.0
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 42.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End
