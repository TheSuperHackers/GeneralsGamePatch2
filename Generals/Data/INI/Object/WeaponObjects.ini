Object HumveeMissile
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = UVRockBug_m
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***

  EditorSorting = SYSTEM
  VisionRange = 0.0
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quietly destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX = FX_GenericMissileDisintegrate
    OCL = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX = FX_GenericMissileDeath
  End

  Behavior = PhysicsBehavior ModuleTag_06
    Mass = 1.0
  End
  Behavior = MissileAIUpdate ModuleTag_07
    TryToFollowTarget = NO
    FuelLifetime = 1000
    InitialVelocity = 150.0 ; in dist/sec
    IgnitionDelay = 0
    IgnitionFX = FX_HumveeMissileIgnition
    DistanceToTravelBeforeTurning = 3.0
  End
  Locomotor = SET_NORMAL RocketBuggyMissileLocomotor

  Geometry = SPHERE
  GeometryMajorRadius = 2.0
  GeometryIsSmall = YES
End

; Missiles used by the Patriot. This is the projectile attached to PatriotMissileWeapon in Weapon.ini

Object PatriotMissile
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = AVRaptor_M
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:PatriotMissile
  EditorSorting = VEHICLE
  VisionRange = 300.0
  ShroudClearingRange = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf = CAN_CAST_REFLECTIONS PROJECTILE SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quietly destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX = FX_GenericMissileDisintegrate
    OCL = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX = FX_GenericMissileDeath
  End

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 1.0
  End
  Behavior = MissileAIUpdate ModuleTag_05
    TryToFollowTarget = YES
    FuelLifetime = 10000
    InitialVelocity = 50.0 ; in dist/sec
    IgnitionDelay = 0
    DistanceToTravelBeforeTurning = 5.0
    DistanceToTargetForLock = 100.0 ; If it gets within 100 of the target, it kills the target.
  End
  Locomotor = SET_NORMAL PatriotMissileLocomotor
  Geometry = SPHERE
  GeometryMajorRadius = 2.0
  GeometryIsSmall = YES
End

Object A10ThunderboltMissile
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = AVWarthog_M
      ParticleSysBone = NONE MissileExhaust
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Missile
  Side = America
  EditorSorting = SYSTEM
  VisionRange = 0.0
  TransportSlotCount = 1
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** AUDIO Parameters ***

  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD CAN_CAST_REFLECTIONS PROJECTILE SMALL_MISSILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    ; no FX, just quietly destroy ourselves
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX = FX_GenericMissileDisintegrate
    OCL = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX = FX_GenericMissileDeath
  End

  ; The weapon is in OCL.ini. This makes it do double damage secretly.
  ; Behavior = FireWeaponWhenDeadBehavior ModuleTag_05
  ;   DeathWeapon = A10ThunderboltMissileWeapon
  ;   StartsActive = YES
  ; End

  Behavior = PhysicsBehavior ModuleTag_08
    Mass = 1.0
  End
  Behavior = MissileAIUpdate ModuleTag_09
    TryToFollowTarget = YES
    FuelLifetime = 10000
    InitialVelocity = 30.0 ; in dist/sec
    IgnitionDelay = 0
    IgnitionFX = FX_A10ThunderboltMissileIgnition
  End

  Locomotor = SET_NORMAL A10ThunderboltMissileLocomotor

  Behavior = SpecialPowerCompletionDie ModuleTag_11
    SpecialPowerTemplate = SuperweaponA10ThunderboltMissileStrike
  End

  Geometry = SPHERE
  GeometryMajorRadius = 1.0
  GeometryIsSmall = YES
End

