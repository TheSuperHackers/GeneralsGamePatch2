Object CarpetBomb
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = EXCarptBmb
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:CarpetBomb
  Side = America
  EditorSorting = SYSTEM
  VisionRange = 300.0
  TransportSlotCount = 1
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** AUDIO Parameters ***
  SoundFallingFromPlane = DaisyCutterWeapon

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
  End
  Locomotor = SET_NORMAL NONE

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 75.0
    AerodynamicFriction = 1.0 ; friction/sec
    ForwardFriction = 33.0 ; friction/sec
    CenterOfMassOffset = 2.0 ; Default of 0 means nothing tips as it falls. Positive tips forward, negative tips back
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_05
    DeathWeapon = CarpetBombWeapon
    StartsActive = YES
  End

  Behavior = HeightDieUpdate ModuleTag_06
    TargetHeight = 1.0
    TargetHeightIncludesStructures = NO
  End

  Behavior = SpecialPowerCompletionDie ModuleTag_07
    SpecialPowerTemplate = SuperweaponCarpetBomb
  End

  Behavior = FXListDie ModuleTag_08
    DeathFX = FX_CarpetBomb
  End
  Behavior = DestroyDie ModuleTag_09
    ; <NO DATA>
  End
End

Object AuroraBomb
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = EXCarptBmb
    End
  End

  ; *** DESIGN Parameters ***
  Side = America
  EditorSorting = SYSTEM
  VisionRange = 0.0
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** AUDIO Parameters ***

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = PhysicsBehavior ModuleTag_03
    Mass = 75.0
    AerodynamicFriction = 2.0 ; friction/sec
    ForwardFriction = 2.0 ; friction/sec
    CenterOfMassOffset = 2.0 ; Default of 0 means nothing tips as it falls. Positive tips forward, negative tips back
  End

  ; it may seem odd to have a "bomb" with a Locomotor, especially a Thrust locomotor,
  ; but there's a good reason: the Aurora moves so freakin' fast that it's really
  ; hard to (1) find a reliable drop location, and (2) actually get it close enough to
  ; that location. So we cheat: just get fairly close, then let the "bomb" do a little (subtle)
  ; navigation on the way down. This works pretty well and actually looks much better
  ; than you might think. (srj)
  Behavior = MissileAIUpdate ModuleTag_04
    TryToFollowTarget = NO
    FuelLifetime = 0
    InitialVelocity = 0.0 ; in dist/sec
    IgnitionDelay = 0
    DistanceToTravelBeforeTurning = 0.0
    DistanceToTargetBeforeDiving = 0.0
  End
  Locomotor = SET_NORMAL AuroraBombLocomotor ; yes, that's right.

  Geometry = SPHERE
  GeometryMajorRadius = 2.0
  GeometryIsSmall = YES
End

; this is the "standard" mine used for building upgrades
Object ChinaStandardMine
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ; NOTE: ParticleSysBone doesn't work correctly with DefaultConditionState!
    ; fix someday! (srj)
    ConditionState = NONE
      Model = EXAMineGroup
      ParticleSysBone = Mine01 MineFX
      ParticleSysBone = Mine02 MineFX
      ParticleSysBone = Mine03 MineFX
      ParticleSysBone = Mine04 MineFX
      ParticleSysBone = Mine05 MineFX
      ParticleSysBone = Mine06 MineFX
      ParticleSysBone = Mine07 MineFX
      ParticleSysBone = Mine08 MineFX
    End
    ConditionState = RUBBLE
      Model = NONE
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:StructureMine
  EditorSorting = MISC_MAN_MADE
  ArmorSet
    Conditions = NONE
    Armor = MineArmor
    DamageFX = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = STICK_TO_TERRAIN_SLOPE IMMOBILE MINE NO_HEAL_ICON
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = StealthUpdate ModuleTag_03
    StealthDelay = 0 ; in milliseconds
    StealthForbiddenConditions = NONE
    FriendlyOpacityMin = 0.0%
    FriendlyOpacityMax = 0.0%
    InnateStealth = YES
    OrderIdleEnemiesToAttackMeUponReveal = NO
  End

  ; this is a misleading name, since it's really a single Mine Behavior...
  Behavior = MinefieldBehavior ModuleTag_04
    DetonationWeapon = StructureMineWeapon ; what happens when we detonate
    DetonatedBy = ENEMIES NEUTRAL
    ; we no longer want the "scoot" behavior. it looks funky with current art. (srj)
    ; ScootFromStartingPointTime = 500
    RepeatDetonateMoveThresh = 5.0
    NumVirtualMines = 8
    Regenerates = YES ; Standard mines DO regenerate.
    StopsRegenAfterCreatorDies = YES
    DegenPercentPerSecondAfterCreatorDies = 3.33% ; take about 30 seconds to die.
  End

  ; Standard mines DO heal.
  Behavior = AutoHealBehavior ModuleTag_05
    HealingAmount = 2
    HealingDelay = 5000 ; in milliseconds
    StartsActive = YES
    StartHealingDelay = 15000 ; wait this long after we are damaged to start healing
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 30.0
  GeometryHeight = 1.0
  GeometryIsSmall = NO
End
