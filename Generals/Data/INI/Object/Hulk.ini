Object AmericaVehicleHumveeDeadHull
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = AVHUMMER_D1
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  Side = America
  EditorSorting = DEBRIS
  TransportSlotCount = 0

  ; *** AUDIO Parameters ***

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = CAN_CAST_REFLECTIONS IMMOBILE NO_COLLIDE HULK

  Body = ActiveBody ModuleTag_02
    MaxHealth = 1.0
    InitialHealth = 1.0
  End

  Behavior = PhysicsBehavior ModuleTag_03
    Mass = 50.0
    AllowBouncing = YES
  End

  Behavior = LifetimeUpdate ModuleTag_04
    MinLifetime = 0 ; min lifetime in milliseconds
    MaxLifetime = 0 ; max lifetime in milliseconds
  End

  Behavior = SlowDeathBehavior ModuleTag_05
    SinkDelay = 14000
    SinkRate = 2.0 ; in dist/sec
    DestructionDelay = 20000
  End

  Behavior = TransitionDamageFX ModuleTag_06
    RubbleParticleSystem1 = Bone:Smoke RandomBone:YES PSys:SmokeSmallContinuous01
  End

  Geometry = BOX
  GeometryMajorRadius = 9.0
  GeometryMinorRadius = 6.0
  GeometryHeight = 7.5
  GeometryIsSmall = YES
End

