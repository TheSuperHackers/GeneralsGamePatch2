Object ScorpionTankShell
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = AVTankShel
    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TankShell
  EditorSorting = SYSTEM
  VisionRange = 0.0
  ArmorSet
    Armor = ProjectileArmor
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = DestroyDie ModuleTag_03
    ; <NO DATA>
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_04
    TriggeredBy = Upgrade_GLAToxinShells
    ConflictsWith = Upgrade_GLAAnthraxBeta
    DeathWeapon = ToxinShellWeapon
    StartsActive = NO ; turned on by upgrade
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_05
    TriggeredBy = Upgrade_GLAToxinShells Upgrade_GLAAnthraxBeta
    RequiresAllTriggers = YES ; TriggeredBy is an AND, not an OR like it normally is
    DeathWeapon = ToxinShellWeaponUpgraded
    StartsActive = NO ; turned on by upgrade
  End

  Behavior = DumbProjectileBehavior ModuleTag_06
    FirstHeight = 10.0 ; Height of the Bezier control points above the highest intervening terrain
    SecondHeight = 10.0
    FirstPercentIndent = 50.0% ; Percentage of shot distance in which control points are placed
    SecondPercentIndent = 90.0%
    DetonateCallsKill = YES
    FlightPathAdjustDistPerSecond = 100.0 ; Can allow a max speed this can attempt to follow a target. Units are their velocity we can tag.
  End

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 0.01 ; can't be zero, but we want it tiny so that it travels nearly straight
  End

  ; The Toxin explosions don't want to double up on particles, so only play this effect if we don't have Toxin
  Behavior = FireWeaponWhenDeadBehavior ModuleTag_08
    ConflictsWith = Upgrade_GLAToxinShells
    DeathWeapon = ScoprionTankGunFXWeapon
    StartsActive = YES
  End

  Geometry = SPHERE
  GeometryMajorRadius = 1.0
  GeometryIsSmall = YES
End
