Object DemoTrapDetonationObject ; The explodes-next-frame object when a Demo Trap is triggered.
  ; *** DESIGN Parameters ***
  Side = GLA
  EditorSorting = SYSTEM
  VisionRange = 0.0 ; Allow the sticky bomb to show itself to the user?
  TransportSlotCount = 0

  ; *** AUDIO Parameters ***

  ; *** ENGINEERING Parameters ***
  RadarPriority = NOT_ON_RADAR
  KindOf = PROJECTILE

  Behavior = PhysicsBehavior ModuleTag_01
    Mass = 5.0
  End

  ; This determines how long the bomb lives before it explodes (via SlowDeathBehavior)
  Behavior = LifetimeUpdate ModuleTag_02
    MinLifetime = 1 ; min lifetime in milliseconds
    MaxLifetime = 1 ; max lifetime in milliseconds
  End

  Behavior = SlowDeathBehavior ModuleTag_03
    DestructionDelay = 1
    FX = INITIAL WeaponFX_DemoTrapDetonation
    Weapon = FINAL DemoTrapDetonationWeapon
  End
End
