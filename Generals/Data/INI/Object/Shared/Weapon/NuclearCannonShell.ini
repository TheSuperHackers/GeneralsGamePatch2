Object NuclearCannonShell
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = NVNUKECN_B
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Missile
  EditorSorting = SYSTEM
  VisionRange = 0.0
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = FireWeaponWhenDeadBehavior ModuleTag_03
    DeathWeapon = ChinaPowerPlantDeathWeapon
    StartsActive = YES
  End

  Behavior = HeightDieUpdate ModuleTag_04
    TargetHeight = 1.0
    TargetHeightIncludesStructures = NO
    OnlyWhenMovingDown = YES
    InitialDelay = 1000 ; Can't explode in the first second so we don't explode on the pad
  End

  Behavior = InstantDeathBehavior DeathModuleTag_01
    DeathTypes = NONE +DETONATED
    ; we detonated normally.
    FX = FX_NukeGLA
  End
  Behavior = InstantDeathBehavior DeathModuleTag_02
    DeathTypes = NONE +LASERED
    FX = FX_GenericMissileDisintegrate
    OCL = OCL_GenericMissileDisintegrate
  End
  Behavior = InstantDeathBehavior DeathModuleTag_03
    DeathTypes = ALL -LASERED -DETONATED
    FX = FX_GenericMissileDeath
  End

  Behavior = PhysicsBehavior ModuleTag_09
    Mass = 1.0
  End
  Behavior = MissileAIUpdate ModuleTag_10
    TryToFollowTarget = NO
    FuelLifetime = 4000
    InitialVelocity = 20.0 ; in dist/sec
    IgnitionDelay = 0
    IgnitionFX = FX_BuggyMissileIgnition
    DistanceToTravelBeforeTurning = 40.0
    DistanceToTargetBeforeDiving = 50.0 ; When I hit this close to target, I ignore PreferredHeight.
    ; Note, if this is too small, the missile will turn too late to hit. And, since we have a 2D
    ; heart, being over the target counts as "there", so we'll give up and just go straight.
  End
  Locomotor = SET_NORMAL NuclearCannonShellLocomotor

  Geometry = CYLINDER ; Since collision extents can't tilt, this is a little fake
  GeometryMajorRadius = 4.0
  GeometryHeight = 4.0
  GeometryIsSmall = YES
  Shadow = SHADOW_DECAL
End
