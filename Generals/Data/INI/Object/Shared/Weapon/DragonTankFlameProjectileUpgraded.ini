Object DragonTankFlameProjectileUpgraded
  ; Explanation - Particles can't do damage, so this is a fast-shooting, low-
  ; damage invisible missile launcher with a flame trail for exhaust

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = NONE
    End
    OkToChangeModelColor = YES
  End
  ; Must have a draw module to be allowed to draw detonation FX

  ; *** DESIGN Parameters ***
  EditorSorting = SYSTEM
  VisionRange = 0.0
  ArmorSet
    Conditions = NONE
    Armor = ProjectileArmor
    DamageFX = NONE
  End

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = DestroyDie ModuleTag_03
    ; <NO DATA>
  End

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 1.0
    AllowCollideForce = NO ; flames collide, but never apply forces when they do so
  End
  Behavior = MissileAIUpdate ModuleTag_05
    TryToFollowTarget = NO
    FuelLifetime = 350
    InitialVelocity = 120.0 ; in dist/sec
    IgnitionDelay = 0
    DistanceToTravelBeforeTurning = 2.0
    DistanceToTargetForLock = 0.0
    DetonateOnNoFuel = YES
    GarrisonHitKillRequiredKindOf = INFANTRY
    GarrisonHitKillForbiddenKindOf = NONE
    GarrisonHitKillCount = 2
    GarrisonHitKillFX = FX_DragonFlameGarrisonBuildingHit
  End
  Locomotor = SET_NORMAL DragonTankFlameLocomotor

  Behavior = BoneFXUpdate ModuleTag_06
    PristineParticleSystem1 = Bone:NONE OnlyOnce:YES 0.0 0.0 PSys:FlameThrowerTrail01Upgraded ; Covers the gap at the beginning of the line
    PristineParticleSystem2 = Bone:NONE OnlyOnce:YES 0.0 0.0 PSys:FlameThrowerTrail02Upgraded
    PristineParticleSystem3 = Bone:NONE OnlyOnce:YES 0.0 0.0 PSys:FlameThrowerTrail03Upgraded
    PristineParticleSystem4 = Bone:NONE OnlyOnce:YES 0.0 0.0 PSys:FlameThrowerTrail04Upgraded
    PristineParticleSystem5 = Bone:NONE OnlyOnce:YES 0.0 0.0 PSys:FlameThrowerTrail06Upgraded

    PristineParticleSystem6 = Bone:NONE OnlyOnce:YES 0.0 0.0 PSys:FlameThrowerSmoke01
  End

  Behavior = BoneFXDamage ModuleTag_07
    ; <NO DATA>
  End

  Geometry = SPHERE
  GeometryMajorRadius = 2.0
  GeometryIsSmall = YES
End
