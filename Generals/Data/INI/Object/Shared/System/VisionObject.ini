; This object is used as a generic vision object when we want to reveal
; shrouded areas for players

Object VisionObject
  ; *** DESIGN Parameters ***
  EditorSorting = SYSTEM
  ShroudClearingRange = 100.0 ; default value, you can override this in code

  ; *** ENGINEERING Parameters ***
  KindOf = NO_COLLIDE IMMOBILE UNATTACKABLE REVEAL_TO_ALL INERT
  Body = ImmortalBody ModuleTag_01
    MaxHealth = 1.0
    InitialHealth = 1.0
  End
End
