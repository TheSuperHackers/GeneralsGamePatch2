    End

    ; snow reallydamaged
    ConditionState = REALLYDAMAGED SNOW
      Model = ZBODerrick_ES
    End
    ConditionState = REALLYDAMAGED SNOW CAPTURED
      Model = ZBODerrick_ES
      Animation = ZBODerrick_ES.ZBODerrick_ES
