  ; Flag Model
  Draw = W3DModelDraw ModuleTag_02
    ; default & damaged
    ConditionState = NONE
      Model = ZBODerrick_F
      Animation = ZBODerrick_F.ZBODerrick_F
      AnimationMode = LOOP
    End
    AliasConditionState = DAMAGED

    ; reallydamaged
    ConditionState = REALLYDAMAGED
      Model = ZBODerrick_FE
      Animation = ZBODerrick_FE.ZBODerrick_FE
      AnimationMode = LOOP
    End

    ; rubble
    ConditionState = RUBBLE
      Model = NONE
    End
    OkToChangeModelColor = YES
  End
  ; New Fence Animations
  Draw = W3DModelDraw ModuleTag_LightingAnimations
    DefaultConditionState
      Model = ZBODerrick_A1
      Animation = ZBODerrick_A1.ZBODerrick_A1
      AnimationMode = LOOP
    End

    ConditionState = DAMAGED
      Model = ZBODerrick_A1D
      Animation = ZBODerrick_A1D.ZBODerrick_A1D
      AnimationMode = LOOP
    End

    ConditionState = REALLYDAMAGED
      Model = ZBODerrick_A1E
      Animation = ZBODerrick_A1E.ZBODerrick_A1E
      AnimationMode = LOOP
    End

    ConditionState = RUBBLE
      Model = NONE
    End
    AnimationsRequirePower = NO
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TechOilDerrick
  EditorSorting = STRUCTURE
  ShroudClearingRange = 100.0
  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End

  ; *** AUDIO Parameters ***
  SoundDie = BuildingDie
  SoundOnDamaged = BuildingDamagedStateLight
  SoundOnReallyDamaged = BuildingDestroy

  ; *** ENGINEERING Parameters ***
  KindOf = STRUCTURE SELECTABLE IMMOBILE CAPTURABLE TECH_BUILDING
  Body = ActiveBody ModuleTag_03
    MaxHealth = 2000.0
    InitialHealth = 2000.0
  End

  Behavior = AutoDepositUpdate ModuleTag_04
    DepositTiming = 12000 ; in milliseconds
    DepositAmount = 200 ; cash amount to deposit every DepositTiming
    InitialCaptureBonus = 1000 ; capture bonus only happens once
  End

  Behavior = FlammableUpdate ModuleTag_05
    FlameDamageLimit = 20.0
    FlameDamageExpiration = 2000
    AflameDuration = 5000
    AflameDamageAmount = 25
    AflameDamageDelay = 500
  End

  Behavior = FXListDie ModuleTag_07
    DeathFX = WeaponFX_BombTruckDefaultBombDetonation
  End

  Behavior = TransitionDamageFX ModuleTag_08
    DamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallSmoke

    ReallyDamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallSmoke
    ReallyDamagedParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallExplosion
    ReallyDamagedParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionSmallShockwave
  End

  Behavior = TechBuildingBehavior ModuleTag_09
    ; <NO DATA>
  End

  ; Note that structures with "RUBBLE" states should not use DestroyDie; such buildings are
  ; never truly destroyed, even when reduced to zero health. Also note that garrisonable
  ; buildings automatically stick around because GarrisonContain has its own DieModule
  Behavior = KeepObjectDie ModuleTag_IWantRubble
  End

  Geometry = BOX
  GeometryMajorRadius = 23.0
  GeometryMinorRadius = 21.0
  GeometryHeight = 30.0
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
End
