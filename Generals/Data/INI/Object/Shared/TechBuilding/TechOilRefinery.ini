  ; Flag Model
  Draw = W3DModelDraw ModuleTag_02
    ; default & damaged
    ConditionState = NONE
      Model = ZBRefinery_F
      Animation = ZBRefinery_F.ZBRefinery_F
      AnimationMode = LOOP
    End
    AliasConditionState = DAMAGED

    ; reallydamaged
    ConditionState = REALLYDAMAGED
      Model = ZBRefinery_FE
      Animation = ZBRefinery_FE.ZBRefinery_FE
      AnimationMode = LOOP
    End

    ; rubble
    ConditionState = RUBBLE
      Model = NONE
    End
    OkToChangeModelColor = YES
  End
  ; New Fence Animations
  Draw = W3DModelDraw ModuleTag_LightingAnimations
    DefaultConditionState
      Model = ZBRefinery_A1
      Animation = ZBRefinery_A1.ZBRefinery_A1
      AnimationMode = LOOP
    End

    ConditionState = DAMAGED
      Model = ZBRefinery_A1D
      Animation = ZBRefinery_A1D.ZBRefinery_A1D
      AnimationMode = LOOP
    End

    ConditionState = REALLYDAMAGED
