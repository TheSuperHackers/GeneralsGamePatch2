  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:TechOilRefinery
  EditorSorting = STRUCTURE
  ShroudClearingRange = 100.0

  ArmorSet
    Conditions = NONE
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End

  ; *** AUDIO Parameters ***
  SoundDie = BuildingDie
  SoundOnDamaged = BuildingDamagedStateLight
  SoundOnReallyDamaged = BuildingDestroy

  ; *** ENGINEERING Parameters ***
  KindOf = STRUCTURE SELECTABLE IMMOBILE CAPTURABLE TECH_BUILDING
  Body = ActiveBody ModuleTag_03
    MaxHealth = 2000.0
    InitialHealth = 2000.0
  End

  Behavior = GrantUpgradeCreate ModuleTag_04
    UpgradeToGrant = Upgrade_CostReduction
  End
  Behavior = CostModifierUpgrade ModuleTag_05
    TriggeredBy = Upgrade_CostReduction
    EffectKindOf = VEHICLE
    Percentage = -10.0%
  End

  Behavior = FlammableUpdate ModuleTag_07
    FlameDamageLimit = 20.0
    FlameDamageExpiration = 2000
    AflameDuration = 5000
    AflameDamageAmount = 25
    AflameDamageDelay = 500
  End

  Behavior = FXListDie ModuleTag_08
    DeathFX = WeaponFX_BombTruckHighExplosiveBombDetonation
  End

  Behavior = TransitionDamageFX ModuleTag_09
    DamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke

    ReallyDamagedParticleSystem1 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:NONE RandomBone:NO PSys:StructureTransitionMediumShockwave
  End

  ; Note that structures with "RUBBLE" states should not use DestroyDie; such buildings are
  ; never truly destroyed, even when reduced to zero health. Also note that garrisonable
  ; buildings automatically stick around because GarrisonContain has its own DieModule
  Behavior = KeepObjectDie ModuleTag_IWantRubble
  End

  Behavior = TechBuildingBehavior ModuleTag_10
    ; <NO DATA>
  End

  Geometry = BOX
  GeometryMajorRadius = 37.0
  GeometryMinorRadius = 40.0
  GeometryHeight = 60.0
  GeometryIsSmall = NO
  Shadow = SHADOW_VOLUME
End
