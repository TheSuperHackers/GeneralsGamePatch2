; This file contains only units that are not part of any specific
; game faction. An example is an object with "behavior" that isn't
; specifically tied to any player/faction such as a bird, bear, or
; donkey. Any objects related to those civilian units also appear in
; here such as debris or necessary weapon-firing objects

Object MilitiaTank
  ; *** ART Parameters ***
  Draw = W3DTankDraw ModuleTag_01
    DefaultConditionState
      Model = CVTank
      Turret = Turret01
      WeaponFireFXBone = PRIMARY MuzzleFX
      WeaponRecoilBone = PRIMARY Barrel
      WeaponMuzzleFlash = PRIMARY MuzzleFX
      WeaponLaunchBone = PRIMARY MuzzleFX
    End
    ConditionState = REALLYDAMAGED
      Model = CVTank_D
    End
    ConditionState = RUBBLE
      Model = CVTank_D
    End
    OkToChangeModelColor = YES

    TrackMarks = EXTnkTrack.tga
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:MilitiaTank
  Side = Civilian
  EditorSorting = VEHICLE
  VisionRange = 150.0
  ShroudClearingRange = 300.0
  TransportSlotCount = 3
  ArmorSet
    Conditions = NONE
    Armor = TankArmor
    DamageFX = TankDamageFX
  End
  ArmorSet
    Conditions = PLAYER_UPGRADE
    Armor = UpgradedTankArmor
    DamageFX = TankDamageFX
  End
  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY MilitiaTankGun
  End
  Prerequisites
    Object = AmericaWarFactory
  End
  BuildCost = 500
  BuildTime = 12.0 ; in seconds
  ExperienceValue = 100 100 200 400
  ExperienceRequired = 0 200 300 600
  IsTrainable = YES
  CrusherLevel = 1 ; What can I crush? 1 == infantry, 2 == trees, 3 == vehicles
  CrushableLevel = 2 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = GenericCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = NoSound ; MilitiaTankVoiceSelect
  VoiceMove = NoSound ; MilitiaTankVoiceMove
  VoiceAttack = NoSound ; MilitiaTankVoiceAttack
  SoundMoveStart = NoSound ; MilitiaTankMoveStart
  SoundMoveStartDamaged = NoSound
  UnitSpecificSounds
    TurretMoveStart = NoSound
    TurretMoveLoop = NoSound
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth = 480.0
    InitialHealth = 480.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate = 140.0 ; turn rate, in degrees/sec
      ControlledWeaponSlots = PRIMARY
    End
    AutoAcquireEnemiesWhenIdle = YES
  End
  Locomotor = SET_NORMAL MilitiaTankLocomotor
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 50.0
  End

  Behavior = ProductionUpdate ModuleTag_05
    ; <NO DATA>
  End

  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_06
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 50
    DestructionDelay = 500
    DestructionDelayVariance = 100
    FX = INITIAL FX_GenericTankDeathEffect
    FX = FINAL FX_GenericTankDeathExplosion
    OCL = MIDPOINT OCL_MilitiaTankDeathEffect
  End

  ; Catch fire + explode death
  Behavior = SlowDeathBehavior ModuleTag_07
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 50
    DestructionDelay = 2000
    DestructionDelayVariance = 300
    FX = INITIAL FX_CrusaderCatchFire
    FX = FINAL FX_GenericTankDeathExplosion
    OCL = FINAL OCL_MilitiaTankDeathEffect
  End

  Behavior = TransitionDamageFX ModuleTag_08
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:YES PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc:X:0.0 Y:0.0 Z:0.0 FXList:FX_CrusaderDamageTransition
  End

  Behavior = DestroyDie ModuleTag_09
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  Behavior = FXListDie ModuleTag_10
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End

  Behavior = CreateObjectDie ModuleTag_11
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior = CreateCrateDie ModuleTag_CratesChange
    CrateData = SalvageCrateData
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 5
    AflameDamageDelay = 500
  End

  Geometry = BOX
  GeometryMajorRadius = 15.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
  GeometryIsSmall = YES
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45.0 ; minimum elevation angle above horizon. Used to limit shadow length.
End

