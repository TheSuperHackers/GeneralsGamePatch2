Object CINE_AmericaInfantryBiohazardTech
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ; NORMAL STANDING
    DefaultConditionState
      Model = AITECH_SKN
      WeaponLaunchBone = PRIMARY BIOGUNFX
      IdleAnimation = AITECH_SKL.AITECH_STA 0.0 21
      ; Regular spice animations
      IdleAnimation = AITECH_SKL.AITECH_IDA
      IdleAnimation = AITECH_SKL.AITECH_IDB
      AnimationMode = ONCE
      TransitionKey = TRANS_Stand
    End

    ; NORMAL ATTACK
    ConditionState = FIRING_A
      Animation = AITECH_SKL.AITECH_ATA
      AnimationMode = LOOP
      TransitionKey = TRANS_FiringA
    End
    AliasConditionState = BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RELOADING_A
    AliasConditionState = FIRING_A REALLYDAMAGED
    AliasConditionState = BETWEEN_FIRING_SHOTS_A REALLYDAMAGED
    AliasConditionState = RELOADING_A REALLYDAMAGED

    ConditionState = MOVING FIRING_A
      Animation = AITECH_SKL.AITECH_WKB 15.0
      AnimationMode = LOOP
      ParticleSysBone = NONE InfantryDustTrails
    End
    AliasConditionState = MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = MOVING RELOADING_A

    ConditionState = MOVING
      Animation = AITECH_SKL.AITECH_WKA 15.0
      AnimationMode = LOOP
      ParticleSysBone = NONE InfantryDustTrails
    End

    ConditionState = DYING
      Animation = AITECH_SKL.AITECH_DTA
      Animation = AITECH_SKL.AITECH_DTB
      AnimationMode = ONCE
      TransitionKey = TRANS_Dying
    End

    TransitionState = TRANS_Dying TRANS_Flailing
      Animation = AITECH_SKL.AITECH_ADTD1
      AnimationMode = ONCE
    End

    ConditionState = DYING EXPLODED_FLAILING
      Animation = AITECH_SKL.AITECH_ADTD2
      AnimationMode = LOOP
      TransitionKey = TRANS_Flailing
    End

    ConditionState = DYING EXPLODED_BOUNCING
      Animation = AITECH_SKL.AITECH_ADTD3
      AnimationMode = ONCE
    End

    ConditionState = SPECIAL_CHEERING
      Animation = AITECH_SKL.AITECH_CHA
      AnimationMode = LOOP
    End

    ; PARACHUTING ANIMATIONS
    ConditionState = FREEFALL
      Animation = AITECH_SKL.AITECH_PFL
      AnimationMode = LOOP
      TransitionKey = TRANS_Falling
    End
    AliasConditionState = FREEFALL REALLYDAMAGED
    AliasConditionState = FREEFALL DYING
    ConditionState = PARACHUTING
      Animation = AITECH_SKL.AITECH_PHG
      AnimationMode = LOOP
      TransitionKey = TRANS_Chute
      Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
    End
    AliasConditionState = PARACHUTING REALLYDAMAGED
    AliasConditionState = PARACHUTING DYING
    TransitionState = TRANS_Falling TRANS_Chute
      Animation = AITECH_SKL.AITECH_POP
      AnimationMode = ONCE
      Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
    End
    TransitionState = TRANS_Chute TRANS_Stand
      Animation = AITECH_SKL.AITECH_PDN
      AnimationMode = ONCE
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:BioHazardTech
  Side = America
  EditorSorting = INFANTRY

  VisionRange = 100.0
  ShroudClearingRange = 400.0
  TransportSlotCount = 1
  ArmorSet
    Conditions = NONE
    Armor = HazMatHumanArmor
    DamageFX = InfantryDamageFX
  End

  WeaponSet
    ; *** Fully automated and driven by the CleanupHazardUpdate ***
    Conditions = NONE
    Weapon = PRIMARY BioHazardTechCleanHazardWeapon
    AutoChooseSources = PRIMARY NONE
  End
  Prerequisites
    Object = AmericaBarracks
  End
  ; This unit is by default NOT buildable. In GLA06 this is buildable from the
  ; Barracks of the enemy AI. (The map.ini file is overridden there to make it
  ; buildable = YES) (jkmcd)
  Buildable = NO
  BuildCost = 200
  BuildTime = 5.0 ; in seconds

  ExperienceValue = 50 100 150 400
  ExperienceRequired = 0 150 450 900
  IsTrainable = YES
  CrushableLevel = 0 ; What am I? 0 == infantry, 1 == trees, 2 == general vehicles
  CommandSet = AmericaInfantryHazMatCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = NoSound
  VoiceMove = NoSound
  VoiceAttack = NoSound
  SoundDie = RebelVoiceDie
  UnitSpecificFX
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS INFANTRY SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = CleanupHazardUpdate ModuleTag_03
    WeaponSlot = PRIMARY
    ScanRate = 1000
    ScanRange = 100.0
  End

  ; Can be ordered to clean up a larger area with the ability to move around at an extended range.
  Behavior = CleanupAreaPower ModuleTag_04
    SpecialPowerTemplate = SpecialAbilityAmbulanceCleanupArea
    MaxMoveDistanceFromLocation = 300.0 ; allows the unit to move around while cleaning up
  End

  Behavior = AIUpdateInterface ModuleTag_05
    AutoAcquireEnemiesWhenIdle = NO
  End
  Behavior = AutoFindHealingUpdate ModuleTag_06
    ScanRate = 1000
    ScanRange = 300.0
    NeverHeal = 0.85 ; don't heal if we are > 85% healthy.
    AlwaysHeal = 0.25 ; if we get below 25%, find healing right away.
  End

  Locomotor = SET_NORMAL CINE_HazMatHumanLocomotor

  Behavior = ExperienceScalarUpgrade ModuleTag_07
    TriggeredBy = Upgrade_AmericaAdvancedTraining
    AddXPScalar = 1.0
  End

  Behavior = PhysicsBehavior ModuleTag_08
    Mass = 5.0
  End
  Behavior = ProductionUpdate ModuleTag_09
    ; <NO DATA>
  End

  Behavior = SquishCollide ModuleTag_10
    ; <NO DATA>
  End

  Behavior = SlowDeathBehavior ModuleTag_Death01
    DeathTypes = ALL -CRUSHED -SPLATTED -EXPLODED -BURNED -POISONED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDie
  End
  Behavior = SlowDeathBehavior ModuleTag_Death02
    DeathTypes = NONE +CRUSHED +SPLATTED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDieCrushed
  End
  Behavior = SlowDeathBehavior ModuleTag_Death03
    DeathTypes = NONE +EXPLODED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDie
    FlingForce = 8.0
    FlingForceVariance = 3.0
    FlingPitch = 60.0
    FlingPitchVariance = 10.0
  End
  Behavior = SlowDeathBehavior ModuleTag_Death04
    DeathTypes = NONE +BURNED
    DestructionDelay = 0
    FX = INITIAL FX_GIDie
    OCL = INITIAL OCL_FlamingInfantry
  End
  Behavior = SlowDeathBehavior ModuleTag_Death05
    DeathTypes = NONE +POISONED
    DestructionDelay = 0
    FX = INITIAL FX_GIDie
    OCL = INITIAL OCL_ToxicInfantry
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 13.0

  GeometryIsSmall = YES
  Shadow = SHADOW_DECAL
  ShadowSizeX = 14.0
  ShadowSizeY = 14.0
  ShadowTexture = ShadowI
  BuildCompletion = APPEARS_AT_RALLY_POINT
End
