; This unit is used in a mission for "color".
; This unit is never human-controllable!

Object AmericaInfantryOfficer
  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ; NORMAL STANDING
    DefaultConditionState
      Model = AIOFCR_SKN
      WeaponFireFXBone = PRIMARY Muzzle
      WeaponMuzzleFlash = PRIMARY MuzzleFX
      IdleAnimation = AIOFCR_SKL.AIOFCR_STA 0.0 21
      ; Regular spice animations
      IdleAnimation = AIOFCR_SKL.AIOFCR_IDA
      IdleAnimation = AIOFCR_SKL.AIOFCR_IDB
      AnimationMode = ONCE
      TransitionKey = TRANS_STAND
    End

    ConditionState = MOVING
      Animation = AIOFCR_SKL.AIOFCR_RNA
      AnimationMode = LOOP
      ParticleSysBone = NONE InfantryDustTrails
    End

    ; NORMAL ATTACK

    ; Drawing gun
    ConditionState = PREATTACK_A
      Animation = AIOFCR_SKL.AIOFCR_ATAST
      AnimationMode = ONCE
    End
    AliasConditionState = PREATTACK_A MOVING
    AliasConditionState = PREATTACK_A FIRING_A
    AliasConditionState = PREATTACK_A BETWEEN_FIRING_SHOTS_A

    ; Firing gun
    ConditionState = FIRING_A
      Animation = AIOFCR_SKL.AIOFCR_ATALP
      AnimationMode = LOOP
      TransitionKey = TRANS_FIRING_A
    End
    ConditionState = BETWEEN_FIRING_SHOTS_A
      Animation = AIOFCR_SKL.AIOFCR_ATALP
      AnimationMode = LOOP
      TransitionKey = TRANS_FIRING_A
    End
    AliasConditionState = RELOADING_A
    AliasConditionState = MOVING FIRING_A
    AliasConditionState = MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = MOVING RELOADING_A

    ; This transition allows him to put his gun away when he's finished attacking.
    TransitionState = TRANS_FIRING_A TRANS_STAND
      Animation = AIOFCR_SKL.AIOFCR_ATAED
      AnimationMode = ONCE
    End

    ConditionState = DYING
      Animation = AIOFCR_SKL.AIOFCR_DTA
      Animation = AIOFCR_SKL.AIOFCR_DTB
      AnimationMode = ONCE
      TransitionKey = TRANS_Dying
    End

    TransitionState = TRANS_Dying TRANS_Flailing
      Animation = AIOFCR_SKL.AIOFCR_ADTE1
      AnimationMode = ONCE
    End

    ConditionState = DYING EXPLODED_FLAILING
      Animation = AIOFCR_SKL.AIOFCR_ADTE2
      AnimationMode = LOOP
      TransitionKey = TRANS_Flailing
    End

    ConditionState = DYING EXPLODED_BOUNCING
      Animation = AIOFCR_SKL.AIOFCR_ADTE3
      AnimationMode = ONCE
    End

    ConditionState = SPECIAL_CHEERING
      Animation = AIOFCR_SKL.AIOFCR_CHA
      AnimationMode = LOOP
    End

    ; PARACHUTING ANIMATIONS

    ; @TODO - MISSING ANIMATION FILE
    ; ConditionState = FREEFALL
    ;   Animation = AIOFCR_SKL.AIOFCR_PFL
    ;   AnimationMode = LOOP
    ;   TransitionKey = TRANS_Falling
    ; End
    ; AliasConditionState = FREEFALL REALLYDAMAGED
    ; AliasConditionState = FREEFALL DYING
    ConditionState = PARACHUTING
      Animation = AIOFCR_SKL.AIOFCR_PHG
      AnimationMode = LOOP
      TransitionKey = TRANS_Chute
      Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
    End
    AliasConditionState = PARACHUTING REALLYDAMAGED
    AliasConditionState = PARACHUTING DYING
    TransitionState = TRANS_Falling TRANS_Chute
      Animation = AIOFCR_SKL.AIOFCR_POP
      AnimationMode = ONCE
      Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
    End
    TransitionState = TRANS_Chute TRANS_Stand
      Animation = AIOFCR_SKL.AIOFCR_PTD
      AnimationMode = ONCE
    End
    OkToChangeModelColor = YES
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:Officer
  Side = America
  EditorSorting = INFANTRY
  VisionRange = 150.0
  ShroudClearingRange = 150.0
  TransportSlotCount = 1
  ArmorSet
    Conditions = NONE
    Armor = HumanArmor
    DamageFX = InfantryDamageFX
  End
  WeaponSet
    Conditions = NONE
    Weapon = PRIMARY AmericaOfficerMachineGun
  End

  BuildCost = 400
  BuildTime = 10.0 ; in seconds

  ; *** AUDIO Parameters ***
  VoiceSelect = RangerVoiceSelect
  VoiceGroupSelect = BattleCrySound
  VoiceMove = RangerVoiceMove
  VoiceAttack = RangerVoiceAttack
  SoundDie = RangerVoiceDie
  SoundDieFire = DieByFireUSA
  SoundDieToxin = DieByToxinChina

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS INFANTRY SCORE

  Body = ActiveBody ModuleTag_02
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = YES
  End
  Behavior = AutoFindHealingUpdate ModuleTag_04
    ScanRate = 1000
    ScanRange = 300.0
    NeverHeal = 0.85 ; don't heal if we are > 85% healthy.
    AlwaysHeal = 0.25 ; if we get below 25%, find healing right away.
  End

  Locomotor = SET_NORMAL BasicHumanLocomotor
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 5.0
  End

  Behavior = SquishCollide ModuleTag_07
    ; <NO DATA>
  End

  Behavior = SlowDeathBehavior ModuleTag_Death01
    DeathTypes = ALL -CRUSHED -SPLATTED -EXPLODED -BURNED -POISONED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDie
  End
  Behavior = SlowDeathBehavior ModuleTag_Death02
    DeathTypes = NONE +CRUSHED +SPLATTED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDieCrushed
  End
  Behavior = SlowDeathBehavior ModuleTag_Death03
    DeathTypes = NONE +EXPLODED
    SinkDelay = 3000
    SinkRate = 0.5 ; in dist/sec
    DestructionDelay = 8000
    FX = INITIAL FX_GIDie
    FlingForce = 8.0
    FlingForceVariance = 3.0
    FlingPitch = 60.0
    FlingPitchVariance = 10.0
  End
  Behavior = SlowDeathBehavior ModuleTag_Death04
    DeathTypes = NONE +BURNED
    DestructionDelay = 0
    FX = INITIAL FX_GIDie
    OCL = INITIAL OCL_FlamingInfantry
  End
  Behavior = SlowDeathBehavior ModuleTag_Death05
    DeathTypes = NONE +POISONED
    DestructionDelay = 0
    FX = INITIAL FX_GIDie
    OCL = INITIAL OCL_ToxicInfantry
  End

  Behavior = PoisonedBehavior ModuleTag_10
    PoisonDamageInterval = 100
    PoisonDuration = 3000
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 12.0
  GeometryIsSmall = YES
  Shadow = SHADOW_DECAL
  ShadowSizeX = 14.0
  ShadowSizeY = 14.0
  ShadowTexture = ShadowI
  BuildCompletion = APPEARS_AT_RALLY_POINT
End
