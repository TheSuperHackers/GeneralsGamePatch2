; This file contains all declarations that are specific to a language.
; for example, this is where we set the unicode font for a language

Language
  UnicodeFontName = 細明體
  ; LocalFontFile = PLCC____.TTF ; When we add our game fonts... this is where we do it.
  UseHardWordWrap = YES ; Used to force word wrapping no matter what character we are on at the end of the space
  CopyrightFont = 細明體 12 YES ; Used to display copyright at the start of the game
  MessageFont = 細明體 10 YES ; Used for messages at the top of the screen.
  MilitaryCaptionTitleFont = 細明體 12 YES ; Mission briefing text in the bottom-left corner.
  MilitaryCaptionFont = 細明體 12 NO ; Mission briefing text in the bottom-left corner.
  SuperweaponCountdownNormalFont = 細明體 10 NO ; superweapon countdown in the top right
  SuperweaponCountdownReadyFont = 細明體 10 YES ; superweapon countdown in the top right
  NamedTimerCountdownNormalFont = 細明體 10 NO ; mission-specific timer
  NamedTimerCountdownReadyFont = 細明體 10 NO ; mission-specific timer
  DrawableCaptionFont = 細明體 10 NO ; captions over objects like construction percent.
  DefaultWindowFont = 細明體 14 NO ; default font used by windows that don't specify a font.
  DefaultDisplayStringFont = 細明體 12 NO ; default font used for strings that don't specify a font.
  TooltipFontName = 細明體 8 NO ; mouse tooltips
  NativeDebugDisplay = FixedSys 8 NO ; used to display the frame rate and other debug stats.
  DrawGroupInfoFont = 細明體 10 NO ; used to display the number of the selection group to the left of a unit's health bar.
  CreditsTitleFont = "Placard MT Condensed" 24 NO
  CreditsMinorTitleFont = "Arial Unicode MS" 16 YES
  CreditsNormalFont = "Arial Unicode MS" 14 NO
End
